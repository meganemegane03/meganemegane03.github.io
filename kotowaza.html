<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おっさんのことわざ辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1c2b3a;
    --indigo2:#14202c;
    --paper:#f4ecda;
    --paper-line:#e2d6b8;
    --gold:#c9a24b;
    --gold-dark:#a17f2f;
    --hanko:#b23a2e;
    --ink:#2a2420;
    --ink-dim:#7a6f5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(201,162,75,0.14), transparent 45%),
      linear-gradient(180deg, var(--indigo) 0%, var(--indigo2) 100%);
    color:var(--paper);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 14px 46px;
  }

  .eyebrow{ font-size:11px; letter-spacing:.28em; color:var(--gold); font-weight:700; }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    font-weight:800;
    margin:6px 0 2px;
    color:#fff;
  }
  .sub{ font-size:12px; color:#a9b6c4; margin-bottom:18px; text-align:center; }

  .search-wrap{
    width:100%; max-width:440px;
    position:relative;
    margin-bottom:12px;
  }
  .search-input{
    width:100%;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid rgba(201,162,75,0.35);
    background:rgba(255,255,255,0.06);
    color:#fff;
  }
  .search-input::placeholder{ color:#7f8ea0; }
  .search-results{
    margin-top:8px;
    background:var(--paper);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.35);
    display:none;
  }
  .search-results.show{ display:block; }
  .search-item{
    padding:12px 16px;
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    color:var(--ink);
    border-bottom:1px solid var(--paper-line);
    cursor:pointer;
  }
  .search-item:last-child{ border-bottom:none; }
  .search-item:active{ background:#ece0c4; }
  .search-empty{ padding:14px 16px; font-size:12.5px; color:var(--ink-dim); }

  .gacha-btn{
    width:100%; max-width:440px;
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    color:#2a1b10;
    background:linear-gradient(180deg, var(--gold), var(--gold-dark));
    border:none;
    border-radius:50px;
    padding:15px 10px;
    box-shadow:0 6px 0 #7a5f22, 0 10px 18px rgba(0,0,0,0.3);
    cursor:pointer;
    margin-bottom:20px;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .gacha-btn:active{ transform:translateY(6px); box-shadow:0 0 0 #7a5f22; }

  .card{
    width:100%; max-width:440px;
    background:var(--paper);
    border-radius:18px;
    padding:26px 20px 22px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    color:var(--ink);
    display:none;
    position:relative;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 26px, rgba(178,58,46,0.06) 26px, rgba(178,58,46,0.06) 27px);
  }
  .card.show{ display:block; animation: cardIn .35s ease; }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(8px) scale(0.98); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .card .word{
    font-family:'Shippori Mincho', serif;
    font-size:26px;
    font-weight:800;
    line-height:1.4;
    margin-bottom:14px;
    border-left:4px solid var(--hanko);
    padding-left:12px;
  }
  .card .meaning-label{
    font-size:10.5px; letter-spacing:.15em; color:var(--ink-dim); margin-bottom:4px; font-weight:700;
  }
  .card .meaning{
    font-size:15px; line-height:1.85; margin-bottom:18px;
  }
  .comment-row{
    display:flex; align-items:flex-start; gap:10px;
    background:rgba(28,43,58,0.06);
    border-radius:14px;
    padding:12px 14px;
  }
  .comment-face{
    width:42px; height:42px; border-radius:50%; overflow:hidden; flex:0 0 auto;
    border:2px solid var(--hanko);
  }
  .comment-face img{ width:100%; height:100%; object-fit:cover; object-position:center 18%; }
  .comment-bubble{ font-size:13.5px; line-height:1.7; }
  .comment-bubble b{ display:block; font-size:10px; color:var(--hanko); letter-spacing:.1em; margin-bottom:3px; }

  .hint{
    width:100%; max-width:440px;
    text-align:center;
    font-size:12.5px;
    color:#8b98a8;
    padding:30px 10px;
    line-height:1.8;
  }

  .footnote{ margin-top:20px; font-size:10.5px; color:#7f8ea0; text-align:center; line-height:1.6; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <div class="eyebrow">MEGANE NO OSSAN KOTOWAZA</div>
  <h1>おっさんのことわざ辞典</h1>
  <div class="sub">全204本、検索してもガチャで出してもええで</div>

  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="ことわざを入力して検索…">
    <div class="search-results" id="searchResults"></div>
  </div>

  <button class="gacha-btn" id="gachaBtn">今日の一句をひく</button>

  <div class="card" id="card">
    <div class="word" id="cardWord">石の上にも三年</div>
    <div class="meaning-label">意味</div>
    <div class="meaning" id="cardMeaning">辛いことでも我慢して続けたら…</div>
    <div class="comment-row">
      <div class="comment-face"><img id="commentFace" src="" alt="おっさん"></div>
      <div class="comment-bubble"><b>おっさんの一言</b><span id="cardComment"></span></div>
    </div>
  </div>

  <div class="hint" id="hint">
    検索欄に打ち込むか、「今日の一句をひく」ボタンで<br>ランダムにことわざを紹介するで📖
  </div>

  <div class="footnote">
    意味の解釈はおっさん風の意訳です。正式な意味は辞書等でご確認を。
  </div>

  let actx;
  function ensureAudio(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playPage(){
    try{
      const ctx = ensureAudio();
      const bufferSize = ctx.sampleRate * 0.22;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize) * 0.3;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1000;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      noise.connect(filter); filter.connect(g); g.connect(ctx.destination);
      noise.start();
    }catch(e){}
  }
  function playChime(){
    try{
      const ctx = ensureAudio();
      [880, 1108.7].forEach((f, idx) => {
        const t = ctx.currentTime + idx * 0.1;
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.15, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.37);
      });
    }catch(e){}
  }

  function showEntry(entry){
    ensureAudio();
    playPage();
    cardWord.textContent = entry.w;
    cardMeaning.textContent = entry.m;
    cardComment.textContent = entry.c;
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');
    hint.style.display = 'none';
    searchResults.classList.remove('show');
  }

  function renderResults(query){
    if (!query){
      searchResults.classList.remove('show');
      searchResults.innerHTML = '';
      return;
    }
    const matches = DATA.filter(d => d.w.includes(query)).slice(0, 8);
    searchResults.innerHTML = '';
    if (matches.length === 0){
      const div = document.createElement('div');
      div.className = 'search-empty';
      div.textContent = '見つからんかったわ。他のことわざ試してみてな';
      searchResults.appendChild(div);
    } else {
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.textContent = m.w;
        div.addEventListener('click', () => {
          searchInput.value = m.w;
          showEntry(m);
        });
        searchResults.appendChild(div);
      });
    }
    searchResults.classList.add('show');
  }

  searchInput.addEventListener('input', () => {
    renderResults(searchInput.value.trim());
  });
  searchInput.addEventListener('focus', () => {
    if (searchInput.value.trim()) searchResults.classList.add('show');
  });

  gachaBtn.addEventListener('click', () => {
    const entry = DATA[Math.floor(Math.random()*DATA.length)];
    searchInput.value = '';
    searchResults.classList.remove('show');
    playChime();
    showEntry(entry);
  });
</script>
</body>
</html>
