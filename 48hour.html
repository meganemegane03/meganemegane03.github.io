<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f3eadb">
<title>1日が48時間になる時計</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f3eadb;color:#3b342d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}
.app{width:min(100%,430px);text-align:center}
h1{font-size:25px;margin:0 0 6px;font-weight:800}
.catch{font-size:14px;color:#776d62;margin-bottom:18px}
.clock-wrap{position:relative;width:min(88vw,350px);aspect-ratio:1;margin:0 auto 18px;border-radius:50%;background:#fffaf1;border:10px solid #d4c5b1;box-shadow:inset 0 0 0 2px #b9aa96,0 7px 18px rgba(70,50,30,.12)}
.clock{position:absolute;inset:0;border-radius:50%}
.tick{position:absolute;left:50%;top:50%;width:2px;height:11px;background:#8b7e70;transform-origin:50% 50%}
.tick.major{width:3px;height:17px;background:#5b5046}
.number{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:800}
.hand{position:absolute;left:50%;top:50%;transform-origin:50% 100%;border-radius:8px;z-index:3}
.hour{width:6px;height:31%;background:#4a4037}
.minute{width:4px;height:40%;background:#776a5b}
.second{width:2px;height:43%;background:#a0523e;z-index:4}
.pin{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:#4a4037;transform:translate(-50%,-50%);z-index:5}
.digital{font-variant-numeric:tabular-nums;font-size:clamp(34px,10vw,48px);font-weight:900;letter-spacing:.03em}
.real{font-size:13px;color:#776d62;margin-top:3px}
.card{background:#fffaf1;border:1px solid #d8cbbb;border-radius:17px;padding:15px;margin-top:14px;line-height:1.65;font-size:14px}
.card strong{font-size:16px}
button{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:13px;background:#5b5046;color:#fff;font-size:16px;font-weight:800}
button:active{transform:scale(.98)}
.small{font-size:12px;color:#8a7e72;margin-top:10px}
</style>
</head>
<body>
<main class="app">
<h1>🕰️ 1日が48時間になる時計</h1>
<div class="catch">時間が足りへん？ ほな、1日を倍にしよ🤣</div>
<div class="clock-wrap">
<div class="clock" id="clock"></div>
<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>
<div class="pin"></div>
</div>
<div class="digital" id="digital">00:00:00</div>
<div class="real" id="real">現実の時刻 00:00:00</div>
<div class="card"><strong>この時計の世界では……</strong><br>現実の24時間を、48時間に引き伸ばしています。<br>つまり<strong>現実の30分＝この時計の1時間</strong>😎</div>
<div class="card"><strong>使い方</strong><br>特に何もする必要なし。<br>現実の時計と同じように勝手に進みます。</div>
<button id="nowBtn" type="button">今の時間を確認する</button>
<div class="small">※現実の時間そのものが増えるわけではありません😂</div>
</main>
<script>
(function(){
const clock=document.getElementById("clock"),digital=document.getElementById("digital"),real=document.getElementById("real"),hour=document.getElementById("hour"),minute=document.getElementById("minute"),second=document.getElementById("second"),btn=document.getElementById("nowBtn");
for(let i=0;i<48;i++){
 const angle=i*7.5,t=document.createElement("div");
 t.className="tick"+(i%4===0?" major":"");
 t.style.transform="translate(-50%,-50%) rotate("+angle+"deg) translateY(-"+(i%4===0?"151":"154")+"px)";
 clock.appendChild(t);
 if(i%4===0){
  const n=document.createElement("div"); n.className="number"; n.textContent=i;
  const rad=(angle-90)*Math.PI/180, r=128;
  n.style.left="calc(50% + "+Math.cos(rad)*r+"px)";
  n.style.top="calc(50% + "+Math.sin(rad)*r+"px)";
  clock.appendChild(n);
 }
}
function pad(n){return String(n).padStart(2,"0")}
function update(){
 const d=new Date(),rh=d.getHours(),rm=d.getMinutes(),rs=d.getSeconds(),ms=d.getMilliseconds();
 const total=(rh*3600+rm*60+rs+ms/1000)*2;
 const vh=Math.floor(total/3600)%48,vm=Math.floor((total%3600)/60),vs=Math.floor(total%60);
 digital.textContent=pad(vh)+":"+pad(vm)+":"+pad(vs);
 real.textContent="現実の時刻 "+pad(rh)+":"+pad(rm)+":"+pad(rs);
 hour.style.transform="translate(-50%,-100%) rotate("+((vh%48)*7.5+(vm/60)*7.5)+"deg)";
 minute.style.transform="translate(-50%,-100%) rotate("+((vm/60)*360+(vs/60)*6)+"deg)";
 second.style.transform="translate(-50%,-100%) rotate("+(vs/60*360)+"deg)";
}
update();setInterval(update,250);btn.addEventListener("click",update);
})();
</script>
</body>
</html>
