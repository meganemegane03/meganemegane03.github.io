<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c1810">
<title>めがねのおっさんの占い</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;font-family:'Hiragino Kaku Gothic ProN','メイリオ',sans-serif;color:white;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;position:relative;background-size:cover;background-position:center top;background-attachment:fixed;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:0;}
.content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%;}
h1{font-size:1.3rem;color:#f9ca24;letter-spacing:3px;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,0.8);}
.subtitle{font-size:0.85rem;color:#f0d080;letter-spacing:2px;margin-bottom:16px;text-shadow:0 1px 4px rgba(0,0,0,0.8);}
#name-area{width:100%;max-width:340px;margin-bottom:16px;background:rgba(0,0,0,0.4);border:1px solid rgba(249,202,36,0.3);border-radius:16px;padding:16px;text-align:center;backdrop-filter:blur(6px);}
#name-area p{font-size:0.8rem;color:#ccc;margin-bottom:10px;}
#name-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(249,202,36,0.4);background:rgba(255,255,255,0.1);color:white;font-size:1rem;margin-bottom:10px;outline:none;text-align:center;}
#name-input::placeholder{color:#888;}
#save-btn{background:#f9ca24;color:#1a0a00;border:none;border-radius:20px;padding:8px 24px;font-size:0.9rem;font-weight:bold;cursor:pointer;}
.greeting{font-size:1rem;color:#f9ca24;margin-bottom:4px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.8);}
.change-name{font-size:0.7rem;color:#ccc;cursor:pointer;text-decoration:underline;text-align:center;display:block;margin-top:4px;}
.ossan-wrap{width:150px;height:150px;border-radius:50%;overflow:hidden;border:3px solid #f9ca24;box-shadow:0 0 30px rgba(0,0,0,0.5);margin-bottom:12px;background:#fff;}
.ossan-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity 0.3s ease;}
.ossan-wrap.spinning{animation:spin 0.6s ease-in-out;}
.ossan-wrap.pulsing{animation:pulse 0.4s ease-in-out infinite;}
@keyframes spin{0%{transform:rotate(0deg) scale(1);}50%{transform:rotate(180deg) scale(0.8);}100%{transform:rotate(360deg) scale(1);}}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);box-shadow:0 0 50px #f9ca24aa;}100%{transform:scale(1);}}
.fortune-label{text-align:center;font-size:0.85rem;color:#f9ca24;margin-bottom:8px;letter-spacing:1px;min-height:1.4em;text-shadow:0 1px 4px rgba(0,0,0,0.8);}
.date-label{font-size:0.7rem;color:#ddd;text-align:center;margin-bottom:16px;text-shadow:0 1px 3px rgba(0,0,0,0.8);}
.btn{background:linear-gradient(135deg,#f9ca24,#e6a817);color:#1a0a00;border:none;border-radius:50px;padding:14px 40px;font-size:1.1rem;font-weight:bold;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px rgba(0,0,0,0.4);transition:transform 0.15s;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(0.93);}
.btn.loading{animation:btnPulse 0.5s ease-in-out infinite;pointer-events:none;}
@keyframes btnPulse{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}
.result{margin-top:24px;background:rgba(0,0,0,0.45);border:1px solid rgba(249,202,36,0.3);border-radius:20px;padding:24px 20px;width:100%;max-width:340px;display:none;backdrop-filter:blur(8px);}
.result.show{display:block;animation:cardIn 0.6s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(0.9);}to{opacity:1;transform:translateY(0) scale(1);}}
.result-title{text-align:center;font-size:1rem;color:#f9ca24;letter-spacing:2px;margin-bottom:16px;}
.stars{text-align:center;font-size:1.5rem;margin-bottom:20px;letter-spacing:4px;min-height:2rem;}
.star-item{display:inline-block;opacity:0;transform:scale(0) rotate(-30deg);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.star-item.show{opacity:1;transform:scale(1) rotate(0deg);}
.items{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.item-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.08);border-radius:12px;padding:10px 14px;opacity:0;transform:translateX(-30px);transition:all 0.4s ease;}
.item-row.show{opacity:1;transform:translateX(0);}
.item-icon{font-size:1.3rem;width:28px;text-align:center;}
.item-label{font-size:0.75rem;color:#bbb;width:72px;}
.item-value{font-size:1rem;font-weight:bold;color:#fff;}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;}
.advice-wrap{background:rgba(249,202,36,0.12);border-left:3px solid #f9ca24;border-radius:0 12px 12px 0;padding:14px 16px;opacity:0;transform:translateY(20px);transition:all 0.5s ease;}
.advice-wrap.show{opacity:1;transform:translateY(0);}
.advice-label{font-size:0.7rem;color:#f9ca24;letter-spacing:2px;margin-bottom:6px;}
.advice-text{font-size:1rem;line-height:1.6;color:#fff;}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden;display:none;}
.particle{position:absolute;top:-30px;animation:fall linear infinite;opacity:0.8;}
@keyframes fall{0%{top:-30px;opacity:0.9;}100%{top:110%;opacity:0.1;}}
</style>
</head>

var SEASONS=[
  {name:'🎍 お正月',bg:'winter',emoji:'🎍',isEvent:true,check:function(m,d){return m===1&&d<=7;}},
  {name:'❤️ バレンタイン',bg:'winter',emoji:'❤️',isEvent:true,check:function(m,d){return m===2&&d>=11&&d<=17;}},
  {name:'🌸 春',bg:'spring',emoji:null,isEvent:false,check:function(m,d){return (m===3&&d>=20)||(m===4&&d<=10);}},
  {name:'🌿 初夏',bg:'early_summer',emoji:null,isEvent:false,check:function(m,d){return (m===4&&d>=11)||m===5;}},
  {name:'☔ 梅雨',bg:'rainy',emoji:null,isEvent:false,check:function(m,d){return m===6;}},
  {name:'🎋 七夕',bg:'summer',emoji:'🌟',isEvent:true,check:function(m,d){return m===7&&d>=4&&d<=10;}},
  {name:'🌻 夏',bg:'summer',emoji:null,isEvent:false,check:function(m,d){return (m===7&&d>=11)||m===8;}},
  {name:'🍂 秋',bg:'autumn',emoji:null,isEvent:false,check:function(m,d){return m===9||(m===10&&d<=24);}},
  {name:'🎃 ハロウィン',bg:'autumn',emoji:'🎃',isEvent:true,check:function(m,d){return m===10&&d>=25;}},
  {name:'🍁 晩秋',bg:'autumn',emoji:null,isEvent:false,check:function(m,d){return m===11;}},
  {name:'🎄 クリスマス',bg:'winter',emoji:'🎄',isEvent:true,check:function(m,d){return m===12&&d>=24&&d<=25;}},
  {name:'🎊 年末',bg:'winter',emoji:'🎊',isEvent:true,check:function(m,d){return m===12&&d>=26;}},
  {name:'❄️ 冬',bg:'winter',emoji:null,isEvent:false,check:function(m,d){return (m===1&&d>=8)||(m===2&&(d<=10||d>=18))||(m===3&&d<=19);}},
];
function getSeason(){var d=new Date(),m=d.getMonth()+1,day=d.getDate();for(var i=0;i<SEASONS.length;i++)if(SEASONS[i].check(m,day))return SEASONS[i];return {name:'',bg:'autumn',emoji:null,isEvent:false};}
function applyBg(season){
  document.body.style.backgroundImage='url('+BG[season.bg]+')';
  var p=document.getElementById('particles');
  if(season.isEvent&&season.emoji){
    p.style.display='block';p.innerHTML='';
    for(var i=0;i<12;i++){var el=document.createElement('div');el.className='particle';el.textContent=season.emoji;el.style.left=Math.random()*100+'%';el.style.fontSize=(0.9+Math.random()*0.8)+'rem';el.style.animationDuration=(5+Math.random()*6)+'s';el.style.animationDelay=(Math.random()*5)+'s';p.appendChild(el);}
  } else {p.style.display='none';}
}
var actx=null;
function getCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(freq,type,start,dur,vol){try{var ctx=getCtx(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime+start);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+start+dur);o.start(ctx.currentTime+start);o.stop(ctx.currentTime+start+dur);}catch(e){}}
function playClick(){tone(800,'sine',0,0.06,0.2);}
function playSoundGood(){tone(523,'square',0,0.1,0.15);tone(659,'square',0.1,0.1,0.15);tone(784,'square',0.2,0.1,0.15);tone(880,'square',0.3,0.1,0.18);tone(1047,'square',0.4,0.08,0.2);tone(1175,'square',0.48,0.08,0.2);tone(1319,'square',0.56,0.35,0.25);tone(659,'sine',0.56,0.35,0.1);tone(784,'sine',0.56,0.35,0.1);}
function playSoundNormal(){tone(440,'sine',0,0.2,0.12);tone(554,'sine',0.22,0.2,0.12);tone(523,'sine',0.44,0.3,0.12);}
function playSoundBad(){tone(392,'sine',0,0.2,0.12);tone(349,'sine',0.22,0.2,0.12);tone(311,'sine',0.44,0.2,0.12);tone(262,'sine',0.66,0.4,0.12);}
var COLORS=[{name:'赤',hex:'#e74c3c'},{name:'青',hex:'#3498db'},{name:'緑',hex:'#2ecc71'},{name:'黄',hex:'#f1c40f'},{name:'紫',hex:'#9b59b6'},{name:'橙',hex:'#e67e22'},{name:'桃',hex:'#e91e8c'},{name:'白',hex:'#ecf0f1'},{name:'金',hex:'#f9ca24'},{name:'水色',hex:'#1abc9c'}];
var ITEMS=['ボールペン','手帳','コーヒー','ハンカチ','鍵','財布','めがね','傘','スマホ','イヤホン','メモ帳','消しゴム','付箋','カレンダー','マグカップ','ガム','タオル','本','お茶','クッキー','ミント','サングラス','帽子','ノート','チョコ'];
var DIRS=['北','南','東','西','北東','北西','南東','南西'];
var AG=['ええ日になるで！自信持っていこ！','今日はツイてるで、積極的にいこ！','チャンスが来たら迷わずつかんでみ！','今日の頑張りが後で実を結ぶで！','笑顔でいたら、もっとええことが来るで！','今日は思い切ってやってみ、きっとうまくいくで！','積極的に動いたら、ええことが待ってるで！','今日の自分を信じてみ、おっさんも応援してるで！'];
var AN=['まぁ焦らんことや。','ぼちぼちいこ、それがええねん。','普通の日こそ大事にしてみ。','今日は無理せんと、自分のペースでいこ。','なんでもやってみなわからんやろ。','平凡な日が実は一番ええ日やったりするで。','今日は周りをよく見てみ、気づくことがあるかもな。','ゆっくり着実にいこ、それがおっさん流や。'];
var AB=['今日はちょっと休んでもええんやで。','焦らんと、明日また頑張ればええ。','無理せんと、自分を大事にしてや。','嫌なことがあっても、明日は変わるで。','ゆっくりいこ、おっさんも応援してるで。','今日は守りに徹する日やで、無理したらあかん。','小さいことを丁寧にやる日やで、それでええねん。','今日は誰かに優しくしてみ、それが自分にも返ってくるで。'];
function seededRand(seed){var x=Math.sin(seed+1)*10000;return x-Math.floor(x);}
function hashStr(str){var h=0;for(var i=0;i<str.length;i++){h=((h<<5)-h)+str.charCodeAt(i);h=h&h;}return Math.abs(h);}
function getSeed(){var n=localStorage.getItem('ossanName')||'名無し';var d=new Date();return hashStr(n+d.getFullYear()+''+(d.getMonth()+1)+''+d.getDate());}
function saveName(){var n=document.getElementById('name-input').value.trim();if(!n)return;localStorage.setItem('ossanName',n);showName(n);}
function showName(n){document.getElementById('name-input-area').style.display='none';document.getElementById('name-display').style.display='block';document.getElementById('greeting-text').textContent=n+'さん、今日もええ日にしよか！';}
function changeName(){document.getElementById('name-input-area').style.display='block';document.getElementById('name-display').style.display='none';document.getElementById('name-input').value='';}
function animateStars(n){var el=document.getElementById('stars');el.innerHTML='';for(var i=0;i<5;i++){var s=document.createElement('span');s.className='star-item';s.textContent=i<n?'★':'☆';el.appendChild(s);(function(sp,dl){setTimeout(function(){sp.classList.add('show');},dl);})(s,(i+1)*120);}}
function animateRows(){for(var i=0;i<4;i++){(function(idx){setTimeout(function(){document.getElementById('row'+idx).classList.add('show');},600+idx*150);})(i);}setTimeout(function(){document.getElementById('advice-wrap').classList.add('show');},1300);}
function resetAnimations(){for(var i=0;i<4;i++)document.getElementById('row'+i).classList.remove('show');document.getElementById('advice-wrap').classList.remove('show');}
function fortune(){
  playClick();
  var btn=document.getElementById('main-btn'),wrap=document.getElementById('ossan-wrap');
  btn.classList.add('loading');btn.textContent='占い中…';
  wrap.classList.add('spinning');
  setTimeout(function(){wrap.classList.remove('spinning');wrap.classList.add('pulsing');},600);
  setTimeout(function(){
    var seed=getSeed();
    var sv=Math.floor(seededRand(seed)*4)+2;
    var color=COLORS[Math.floor(seededRand(seed+1)*COLORS.length)];
    document.getElementById('num').textContent=Math.floor(seededRand(seed+2)*99)+1;
    document.getElementById('col').textContent=color.name;
    document.getElementById('cdot').style.background=color.hex;
    document.getElementById('item').textContent=ITEMS[Math.floor(seededRand(seed+3)*ITEMS.length)];
    document.getElementById('dir').textContent=DIRS[Math.floor(seededRand(seed+4)*DIRS.length)];
    var advice,src,label;
    if(sv===5){advice=AG[Math.floor(seededRand(seed+5)*AG.length)];src=IMG_GOOD;label='今日はええ日やで！😄';playSoundGood();}
    else if(sv===2){advice=AB[Math.floor(seededRand(seed+5)*AB.length)];src=IMG_BAD;label='今日はゆっくりいこか…😟';playSoundBad();}
    else{advice=AN[Math.floor(seededRand(seed+5)*AN.length)];src=IMG_NORMAL;label='まぁまぁの日やな😐';playSoundNormal();}
    document.getElementById('advice').textContent='「'+advice+'」';
    document.getElementById('fortune-label').textContent=label;
    var img=document.getElementById('ossan-img');
    img.style.opacity='0';setTimeout(function(){img.src=src;img.style.opacity='1';},200);
    wrap.classList.remove('pulsing');
    btn.classList.remove('loading');btn.textContent='もう一度見る';
    resetAnimations();
    var r=document.getElementById('result');r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
    animateStars(sv);animateRows();
  },1200);
}
window.onload=function(){
  var n=localStorage.getItem('ossanName');if(n)showName(n);
  var d=new Date();
  document.getElementById('date-label').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日の運勢';
  var season=getSeason();
  applyBg(season);
};
</script>
</body>
</html>
