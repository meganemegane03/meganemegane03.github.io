<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c1810">
<title>めがねのおっさんの占い</title>
<link rel="manifest" href="manifest.json">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #1a0a00 0%, #2c1810 50%, #1a0a00 100%);
  font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 40px;
}
h1 {
  font-size: 1.3rem;
  color: #f9ca24;
  letter-spacing: 3px;
  margin-bottom: 4px;
  text-shadow: 0 0 20px #f9ca2466;
}
.subtitle {
  font-size: 0.85rem;
  color: #f0d080;
  letter-spacing: 2px;
  margin-bottom: 16px;
  text-shadow: 0 0 10px #f9ca2444;
}

/* 名前登録エリア */
#name-area {
  width: 100%;
  max-width: 340px;
  margin-bottom: 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(249,202,36,0.3);
  border-radius: 16px;
  padding: 16px;
  text-align: center;
}
#name-area p {
  font-size: 0.8rem;
  color: #aaa;
  margin-bottom: 10px;
}
#name-input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(249,202,36,0.4);
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 1rem;
  margin-bottom: 10px;
  outline: none;
  text-align: center;
}
#name-input::placeholder { color: #888; }
#save-btn {
  background: #f9ca24;
  color: #1a0a00;
  border: none;
  border-radius: 20px;
  padding: 8px 24px;
  font-size: 0.9rem;
  font-weight: bold;
  cursor: pointer;
}
.greeting {
  font-size: 1rem;
  color: #f9ca24;
  margin-bottom: 4px;
  text-align: center;
}
.change-name {
  font-size: 0.7rem;
  color: #888;
  cursor: pointer;
  text-decoration: underline;
  text-align: center;
  display: block;
  margin-top: 4px;
}

.ossan-wrap {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  overflow: hidden;
  border: 3px solid #f9ca24;
  box-shadow: 0 0 30px #f9ca2433;
  margin-bottom: 20px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ossan-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.btn {
  background: linear-gradient(135deg, #f9ca24, #e6a817);
  color: #1a0a00;
  border: none;
  border-radius: 50px;
  padding: 14px 40px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 4px 20px #f9ca2444;
  transition: transform 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.96); }
.result {
  margin-top: 24px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(249,202,36,0.3);
  border-radius: 20px;
  padding: 24px 20px;
  width: 100%;
  max-width: 340px;
  display: none;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
.result.show { display: block; }
.result-title {
  text-align: center;
  font-size: 1rem;
  color: #f9ca24;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.stars {
  text-align: center;
  font-size: 1.5rem;
  margin-bottom: 20px;
  letter-spacing: 4px;
}
.items {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}
.item-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 10px 14px;
}
.item-icon { font-size: 1.3rem; width: 28px; text-align: center; }
.item-label { font-size: 0.75rem; color: #aaa; width: 72px; }
.item-value { font-size: 1rem; font-weight: bold; color: #fff; }
.advice-wrap {
  background: rgba(249,202,36,0.08);
  border-left: 3px solid #f9ca24;
  border-radius: 0 12px 12px 0;
  padding: 14px 16px;
}
.advice-label { font-size: 0.7rem; color: #f9ca24; letter-spacing: 2px; margin-bottom: 6px; }
.advice-text { font-size: 1rem; line-height: 1.6; color: #fff; }
.color-dot { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); flex-shrink:0; }
</style>
</head>
<body>
<h1>めがねのおっさんの占い</h1>
<div class="subtitle">〜 今日の運勢 〜</div>

<div id="name-area">
  <div id="name-input-area">
    <p>お名前を入力してください</p>
    <input type="text" id="name-input" placeholder="例：たろう" maxlength="10">
    <br>
    <button id="save-btn" onclick="saveName()">決定</button>
  </div>
  <div id="name-display" style="display:none;">
    <div class="greeting" id="greeting-text"></div>
    <span class="change-name" onclick="changeName()">名前を変える</span>
  </div>
</div>

<button class="btn" onclick="fortune()">今日の運勢を見る</button>

<div class="result" id="result">
  <div class="result-title">🍀 今日の運勢</div>
  <div class="stars" id="stars"></div>
  <div class="items">
    <div class="item-row">
      <span class="item-icon">🔢</span>
      <span class="item-label">ラッキーナンバー</span>
      <span class="item-value" id="num"></span>
    </div>
    <div class="item-row">
      <span class="item-icon">🎨</span>
      <span class="item-label">ラッキーカラー</span>
      <div class="color-dot" id="cdot"></div>
      <span class="item-value" id="col"></span>
    </div>
    <div class="item-row">
      <span class="item-icon">🎁</span>
      <span class="item-label">ラッキーアイテム</span>
      <span class="item-value" id="item"></span>
    </div>
    <div class="item-row">
      <span class="item-icon">🧭</span>
      <span class="item-label">ラッキー方角</span>
      <span class="item-value" id="dir"></span>
    </div>
  </div>
  <div class="advice-wrap">
    <div class="advice-label">おっさんの一言</div>
    <div class="advice-text" id="advice"></div>
  </div>
</div>

<script>
var COLORS=[
  {name:'赤',hex:'#e74c3c'},{name:'青',hex:'#3498db'},{name:'緑',hex:'#2ecc71'},
  {name:'黄',hex:'#f1c40f'},{name:'紫',hex:'#9b59b6'},{name:'橙',hex:'#e67e22'},
  {name:'桃',hex:'#e91e8c'},{name:'白',hex:'#ecf0f1'},{name:'金',hex:'#f9ca24'},
  {name:'水色',hex:'#1abc9c'}
];
var ITEMS=[
  'ボールペン','手帳','コーヒー','ハンカチ','鍵','財布','めがね','傘',
  'スマホ','イヤホン','メモ帳','消しゴム','付箋','カレンダー','マグカップ',
  'ガム','タオル','本','メガネケース','お茶'
];
var DIRS=['北','南','東','西','北東','北西','南東','南西'];
var ADVICES=[
  'まぁ焦らんことや。','ええ一日になるで、たぶん。','深呼吸して、ゆっくりいこ。',
  '今日は直感を信じてみ。','小さいことを大事にすると、後でええことあるで。',
  'なんでもやってみなわからんやろ。','今日は人の話をよく聞いてみ。',
  '疲れたら休んでええんやで。','笑顔でいれば、だいたいなんとかなる。',
  '今日の自分をほめてあげ。','無理せんでええ、ぼちぼちいこ。',
  '今日出会う人を大切にしてみ。','ちょっとした親切が返ってくるかもな。',
  '好きなもん食べると運気上がるで。','まあ、なるようになるわ。',
  'ちょっとだけ早起きしてみ、世界が変わるで。','今日は笑顔を忘れんといてな。',
  '一歩踏み出したら、あとはなんとかなるわ。','今日の失敗は明日の糧やで。',
  'ゆっくりでええ、着実にいこ。'
];

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randNum(){ return Math.floor(Math.random()*99)+1; }
function randStars(){
  var n=Math.floor(Math.random()*4)+2;
  var s='';
  for(var i=0;i<5;i++) s+=i<n?'★':'☆';
  return s;
}

function saveName(){
  var name=document.getElementById('name-input').value.trim();
  if(!name) return;
  localStorage.setItem('ossanName', name);
  showName(name);
}

function showName(name){
  document.getElementById('name-input-area').style.display='none';
  document.getElementById('name-display').style.display='block';
  document.getElementById('greeting-text').textContent=name+'さん、今日もええ日にしよか！';
}

function changeName(){
  document.getElementById('name-input-area').style.display='block';
  document.getElementById('name-display').style.display='none';
  document.getElementById('name-input').value='';
}

function fortune(){
  var color=rand(COLORS);
  document.getElementById('stars').textContent=randStars();
  document.getElementById('num').textContent=randNum();
  document.getElementById('col').textContent=color.name;
  document.getElementById('cdot').style.background=color.hex;
  document.getElementById('item').textContent=rand(ITEMS);
  document.getElementById('dir').textContent=rand(DIRS);
  
  var name=localStorage.getItem('ossanName');
  var advice=rand(ADVICES);
  document.getElementById('advice').textContent='「'+advice+'」';
  
  var r=document.getElementById('result');
  r.classList.remove('show');
  void r.offsetWidth;
  r.classList.add('show');
}

// 起動時に名前確認
window.onload=function(){
  var name=localStorage.getItem('ossanName');
  if(name) showName(name);
};
</script>
</body>
</html>
