<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2c1810">
<title>めがねのおっさんの占い</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;background:linear-gradient(135deg,#1a0a00 0%,#2c1810 50%,#1a0a00 100%);font-family:'Hiragino Kaku Gothic ProN','メイリオ',sans-serif;color:white;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
h1{font-size:1.3rem;color:#f9ca24;letter-spacing:3px;margin-bottom:4px;text-shadow:0 0 20px #f9ca2466;}
.subtitle{font-size:0.85rem;color:#f0d080;letter-spacing:2px;margin-bottom:16px;}
#name-area{width:100%;max-width:340px;margin-bottom:16px;background:rgba(255,255,255,0.06);border:1px solid rgba(249,202,36,0.3);border-radius:16px;padding:16px;text-align:center;}
#name-area p{font-size:0.8rem;color:#aaa;margin-bottom:10px;}
#name-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(249,202,36,0.4);background:rgba(255,255,255,0.08);color:white;font-size:1rem;margin-bottom:10px;outline:none;text-align:center;}
#name-input::placeholder{color:#888;}
#save-btn{background:#f9ca24;color:#1a0a00;border:none;border-radius:20px;padding:8px 24px;font-size:0.9rem;font-weight:bold;cursor:pointer;}
.greeting{font-size:1rem;color:#f9ca24;margin-bottom:4px;text-align:center;}
.change-name{font-size:0.7rem;color:#888;cursor:pointer;text-decoration:underline;text-align:center;display:block;margin-top:4px;}
.ossan-wrap{width:150px;height:150px;border-radius:50%;overflow:hidden;border:3px solid #f9ca24;box-shadow:0 0 30px #f9ca2433;margin-bottom:12px;background:#fff;}
.ossan-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity 0.3s ease;}
.fortune-label{text-align:center;font-size:0.85rem;color:#f9ca24;margin-bottom:16px;letter-spacing:1px;min-height:1.4em;}
.btn{background:linear-gradient(135deg,#f9ca24,#e6a817);color:#1a0a00;border:none;border-radius:50px;padding:14px 40px;font-size:1.1rem;font-weight:bold;cursor:pointer;letter-spacing:2px;box-shadow:0 4px 20px #f9ca2444;transition:transform 0.2s;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(0.96);}
.result{margin-top:24px;background:rgba(255,255,255,0.06);border:1px solid rgba(249,202,36,0.3);border-radius:20px;padding:24px 20px;width:100%;max-width:340px;display:none;animation:fadeIn 0.5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.result.show{display:block;}
.result-title{text-align:center;font-size:1rem;color:#f9ca24;letter-spacing:2px;margin-bottom:16px;}
.stars{text-align:center;font-size:1.5rem;margin-bottom:20px;letter-spacing:4px;}
.items{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.item-row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.05);border-radius:12px;padding:10px 14px;}
.item-icon{font-size:1.3rem;width:28px;text-align:center;}
.item-label{font-size:0.75rem;color:#aaa;width:72px;}
.item-value{font-size:1rem;font-weight:bold;color:#fff;}
.advice-wrap{background:rgba(249,202,36,0.08);border-left:3px solid #f9ca24;border-radius:0 12px 12px 0;padding:14px 16px;}
.advice-label{font-size:0.7rem;color:#f9ca24;letter-spacing:2px;margin-bottom:6px;}
.advice-text{font-size:1rem;line-height:1.6;color:#fff;}
.color-dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);flex-shrink:0;}
.date-label{font-size:0.7rem;color:#888;text-align:center;margin-bottom:8px;}
</style>
</head>

<div class="subtitle">〜 今日の運勢 〜</div>

    <br>

  <div id="name-display" style="display:none;">
    <div class="greeting" id="greeting-text"></div>

// シード付き擬似乱数
function seededRand(seed){
  var x=Math.sin(seed+1)*10000;
  return x-Math.floor(x);
}

function hashStr(str){
  var hash=0;
  for(var i=0;i<str.length;i++){
    hash=((hash<<5)-hash)+str.charCodeAt(i);
    hash=hash&hash;
  }
  return Math.abs(hash);
}

function getSeed(){
  var name=localStorage.getItem('ossanName')||'名無し';
  var d=new Date();
  var dateStr=d.getFullYear()+''+(d.getMonth()+1)+''+d.getDate();
  return hashStr(name+dateStr);
}

function seededChoice(arr, seed, offset){
  var idx=Math.floor(seededRand(seed+offset)*arr.length);
  return arr[idx];
}

function seededInt(max, seed, offset){
  return Math.floor(seededRand(seed+offset)*max)+1;
}

function renderStars(n){var s='';for(var i=0;i<5;i++)s+=i<n?'★':'☆';return s;}

function saveName(){
  var n=document.getElementById('name-input').value.trim();
  if(!n)return;
  localStorage.setItem('ossanName',n);
  showName(n);
}
function showName(n){
  document.getElementById('name-input-area').style.display='none';
  document.getElementById('name-display').style.display='block';
  document.getElementById('greeting-text').textContent=n+'さん、今日もええ日にしよか！';
}
function changeName(){
  document.getElementById('name-input-area').style.display='block';
  document.getElementById('name-display').style.display='none';
  document.getElementById('name-input').value='';
}

function setFace(src,label){
  var img=document.getElementById('ossan-img');
  img.style.opacity='0';
  setTimeout(function(){img.src=src;img.style.opacity='1';},200);
  document.getElementById('fortune-label').textContent=label;
}

function fortune(){
  var seed=getSeed();
  var starsVal=Math.floor(seededRand(seed)*4)+2; // 2〜5
  var color=COLORS[Math.floor(seededRand(seed+1)*COLORS.length)];
  var num=seededInt(99,seed,2);
  var item=ITEMS[Math.floor(seededRand(seed+3)*ITEMS.length)];
  var dir=DIRS[Math.floor(seededRand(seed+4)*DIRS.length)];

  document.getElementById('stars').textContent=renderStars(starsVal);
  document.getElementById('num').textContent=num;
  document.getElementById('col').textContent=color.name;
  document.getElementById('cdot').style.background=color.hex;
  document.getElementById('item').textContent=item;
  document.getElementById('dir').textContent=dir;

  var advice,src,label;
  if(starsVal===5){
    advice=AG[Math.floor(seededRand(seed+5)*AG.length)];
    src=IMG_GOOD; label='今日はええ日やで！😄';
  } else if(starsVal===2){
    advice=AB[Math.floor(seededRand(seed+5)*AB.length)];
    src=IMG_BAD; label='今日はゆっくりいこか…😟';
  } else {
    advice=AN[Math.floor(seededRand(seed+5)*AN.length)];
    src=IMG_NORMAL; label='まぁまぁの日やな😐';
  }

  document.getElementById('advice').textContent='「'+advice+'」';
  setFace(src,label);

  var r=document.getElementById('result');
  r.classList.remove('show');void r.offsetWidth;r.classList.add('show');
}

window.onload=function(){
  var n=localStorage.getItem('ossanName');
  if(n) showName(n);
  var d=new Date();
  document.getElementById('date-label').textContent=
    d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日の運勢';
};
</script>
