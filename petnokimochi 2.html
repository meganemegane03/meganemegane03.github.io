<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ペットの気持ち">
<link rel="manifest" href="petnokimochi-manifest.json">
<link rel="apple-touch-icon" href="normal-icon-192.JPG">
<title>ペットの気持ち</title>
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#3b3028;--accent:#e8895b;--accent2:#6c9b78;--line:#eadbc5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0 8%,transparent 9%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh}
body:before{content:"🐾  🐾  🐾";position:fixed;top:8px;left:10px;right:10px;text-align:center;opacity:.18;letter-spacing:18px;font-size:22px;pointer-events:none}
main{width:min(680px,100%);margin:auto;padding:28px 16px 38px}
header{text-align:center;margin:16px 0 20px}
h1{font-size:34px;margin:0 0 5px;letter-spacing:.04em}
.subtitle{font-size:14px;opacity:.72}
.card{background:rgba(255,255,255,.92);border:2px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 8px 24px rgba(80,55,30,.08);margin-bottom:16px}
.hero{text-align:center}
.preview-wrap{display:none;position:relative;margin:0 auto 18px;max-width:560px}
.preview{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:22px;background:#f4ead8}
.badge{position:absolute;right:10px;top:10px;background:#fff;padding:6px 10px;border-radius:999px;font-size:12px;box-shadow:0 2px 8px #0001}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.file-label{border:0;border-radius:18px;padding:15px 12px;font-size:16px;font-weight:800;cursor:pointer;text-align:center;transition:transform .08s}
button:active,.file-label:active{transform:scale(.97)}
.primary{background:var(--accent);color:#fff}
.secondary{background:#f1e4cf;color:var(--ink)}
input[type=file]{display:none}
.note{font-size:12px;line-height:1.7;text-align:center;opacity:.7;margin-top:13px}
.result{display:none}
.speech{position:relative;background:#fffdf8;border:3px solid var(--ink);border-radius:24px;padding:20px 18px;margin:8px 0 20px;font-size:19px;font-weight:700;line-height:1.65;text-align:left;white-space:pre-line}
.speech:after{content:"";position:absolute;left:38px;bottom:-15px;width:24px;height:24px;background:#fffdf8;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg)}
.result-title{font-size:24px;text-align:center;font-weight:900;margin:5px 0 12px}
.stats{display:grid;gap:10px}
.stat{display:flex;align-items:center;justify-content:space-between;background:#fff7e8;border-radius:15px;padding:11px 13px;font-size:14px}
.stat b{font-size:15px}
.meter{font-size:18px;letter-spacing:1px}
.small{font-size:11px;opacity:.62}
.bottom-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.disclaimer{text-align:center;font-size:12px;opacity:.65;line-height:1.7;margin:15px 0 0}
.loading{display:none;text-align:center;padding:20px;font-weight:800}
footer{text-align:center;font-size:11px;opacity:.55;margin-top:20px}
@media(max-width:430px){h1{font-size:30px}.card{padding:16px;border-radius:24px}.speech{font-size:18px}button,.file-label{font-size:15px}}
</style>
</head>
<body>
<main>
<header>
<h1>🐾 ペットの気持ち</h1>
<div class="subtitle">この子、いったい何を思ってるんやろ？</div>
</header>

<section class="card hero" id="inputCard">
<div class="preview-wrap" id="previewWrap">
<img id="preview" class="preview" alt="選んだペットの写真">
<div class="badge">📷 写真は端末内だけで使用</div>
</div>
<div id="startText">
<p style="font-size:18px;font-weight:800;margin:5px 0 18px">ペットの写真を見せてや〜🤣</p>
</div>
<div class="actions">
<label class="file-label primary" for="cameraInput">📸 写真を撮る</label>
<label class="file-label secondary" for="photoInput">🖼️ 写真を選ぶ</label>
<input id="cameraInput" type="file" accept="image/*" capture="environment">
<input id="photoInput" type="file" accept="image/*">
</div>
<div class="note">写真はどこにも送信しません。<br>AIで本当の気持ちを読んでいる訳ではありません</div>
</section>

<div class="loading" id="loading">この子の気持ちを勝手に妄想中……🤔</div>

<section class="card result" id="resultCard">
<div class="result-title">この子の気持ちは……</div>
<div class="speech" id="speech"></div>
<div class="stats" id="stats"></div>
<div class="disclaimer">※このアプリの勝手な妄想です。<br>当たってるように見えても、たぶん偶然です</div>
<div class="bottom-actions">
<button class="primary" id="againBtn">🔄 もう一回聞く！</button>
<button class="secondary" id="photoBtn">📸 別の写真で聞く</button>
</div>
</section>

<footer>ペットの気持ち　— 今日も勝手に通訳中 —</footer>
</main>

const flat = Object.entries(lines).flatMap(([category, arr]) => arr.map(text => ({category,text})));
let lastIndex = -1;
let currentUrl = null;

const cameraInput = document.getElementById('cameraInput');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const previewWrap = document.getElementById('previewWrap');
const inputCard = document.getElementById('inputCard');
const resultCard = document.getElementById('resultCard');
const loading = document.getElementById('loading');
const speech = document.getElementById('speech');
const stats = document.getElementById('stats');
let audioCtx = null;
function tapSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(760, now + 0.07);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.12, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.11);
  }catch(e){}
}
document.querySelectorAll("button,.file-label").forEach(el=>{
  el.addEventListener("click", tapSound);
});


function pickLine(){
  let i;
  do { i = Math.floor(Math.random()*flat.length); } while(flat.length>1 && i===lastIndex);
  lastIndex=i;
  return flat[i];
}
function stars(n){
  return "★".repeat(n)+"☆".repeat(5-n);
}
function percent(){
  return Math.floor(Math.random()*101);
}
function makeStats(){
  const mood = Math.floor(Math.random()*5)+1;
  const honesty = Math.floor(Math.random()*5)+1;
  return [
    ["本音度", `<span class="meter">${stars(honesty)}</span>`],
    ["飼い主への不満", `<b>${percent()}%</b>`],
    ["おやつへの執着", `<b>${percent()}%</b>`],
    ["今の機嫌", `<b>${percent()}%</b>`],
    ["AIの自信", `<b>${Math.floor(Math.random()*31)}%</b>`]
  ].map(([label,value])=>`<div class="stat"><span>${label}</span><span>${value}</span></div>`).join("");
}

function showResult(){
  const picked = pickLine();
  speech.textContent = picked.text;
  stats.innerHTML = makeStats();
  resultCard.style.display = "block";
  resultCard.scrollIntoView({behavior:"smooth",block:"start"});
}

function handleFile(file){
  if(!file) return;
  if(!file.type.startsWith("image/")) return;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentUrl = URL.createObjectURL(file);
  preview.src = currentUrl;
  previewWrap.style.display = "block";
  document.getElementById("startText").style.display = "none";
  resultCard.style.display = "none";
  loading.style.display = "block";
  setTimeout(()=>{
    loading.style.display = "none";
    showResult();
  },450);
}

cameraInput.addEventListener("change", e=>handleFile(e.target.files[0]));
photoInput.addEventListener("change", e=>handleFile(e.target.files[0]));
document.getElementById("againBtn").addEventListener("click", ()=>{
  loading.style.display="block";
  resultCard.style.display="none";
  setTimeout(()=>{
    loading.style.display="none";
    showResult();
  },300);
});
document.getElementById("photoBtn").addEventListener("click", ()=>{
  resultCard.style.display="none";
  inputCard.scrollIntoView({behavior:"smooth",block:"start"});
  photoInput.click();
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./petnokimochi-sw.js").catch(()=>{}));
}
</script>
</body>
</html>
