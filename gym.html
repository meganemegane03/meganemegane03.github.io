<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おっさんジム - 今日のノルマガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=DM+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161d27;
    --bg2:#1d2733;
    --panel:#232f3f;
    --panel-line:#334255;
    --lime:#c6ff4d;
    --lime-dark:#8fce1f;
    --orange:#ff7a45;
    --orange-dark:#d85a28;
    --text:#eef1f5;
    --text-dim:#8f9db0;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, rgba(198,255,77,0.08), transparent 45%),
      radial-gradient(circle at 100% 110%, rgba(255,122,69,0.10), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 14px 46px;
  }

  .eyebrow{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:.28em;
    color:var(--lime);
    font-weight:700;
    text-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-size:30px;
    font-weight:700;
    letter-spacing:.02em;
    margin:6px 0 2px;
    color:#ffffff;
  }
  .sub{
    font-size:13px;
    color:#c3ccd9;
    margin-bottom:22px;
    text-align:center;
  }

  .card{
    width:100%;
    max-width:440px;
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line);
    border-radius:18px;
    padding:22px 18px 24px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35);
    position:relative;
  }

  /* ---------- GACHA (slot) VIEW ---------- */
  .reels{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .reel{
    flex:1;
    height:64px;
    background:#10151d;
    border:1px solid var(--panel-line);
    border-radius:10px;
    overflow:hidden;
    position:relative;
  }
  .reel-strip{
    position:absolute;
    left:0; right:0; top:0;
    display:flex;
    flex-direction:column;
  }
  .reel-cell{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Oswald', sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--text-dim);
    text-align:center;
    padding:0 4px;
    line-height:1.2;
  }
  .reel.spinning .reel-strip{
    animation: reelspin 0.28s linear infinite;
  }
  @keyframes reelspin{
    from{ transform:translateY(0); }
    to{ transform:translateY(-64px); }
  }
  .reel.locked .reel-cell{ color:var(--text); font-weight:700; }
  .reel.locked{ border-color:var(--lime); box-shadow:0 0 0 1px rgba(198,255,77,0.25) inset; }

  .gacha-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .gacha-meta b{ color:var(--lime); font-family:'DM Mono', monospace; }

  .btn{
    width:100%;
    font-family:'Oswald', sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.03em;
    border:none;
    border-radius:12px;
    padding:16px 10px;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s ease;
  }
  .btn-lime{
    color:#111;
    background:linear-gradient(180deg, var(--lime), var(--lime-dark));
    box-shadow:0 5px 0 #6a9a15, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn-lime:active{ transform:translateY(5px); box-shadow:0 0 0 #6a9a15; }
  .btn-outline{
    color:var(--text);
    background:transparent;
    border:1.5px solid var(--panel-line);
    margin-top:10px;
  }
  .btn-outline:active{ transform:translateY(2px); }
  .btn[disabled]{ opacity:.45; pointer-events:none; }

  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- WORKOUT VIEW ---------- */
  .phase-label{
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    letter-spacing:.2em;
    color:var(--orange);
    margin-bottom:10px;
    transition:color .25s ease;
  }
  .phase-label.work{ color:var(--lime); }

  .ring-wrap{
    width:220px;
    height:220px;
    margin:0 auto 16px;
    border-radius:50%;
    background:
      conic-gradient(var(--lime) calc(var(--p,0)*1%), #10151d 0);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .1s linear;
  }
  .ring-wrap.rest{
    background:conic-gradient(var(--orange) calc(var(--p,0)*1%), #10151d 0);
  }
  .ring-inner{
    width:186px;
    height:186px;
    border-radius:50%;
    background:var(--bg2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border:1px solid var(--panel-line);
  }
  .timer-num{
    font-family:'DM Mono', monospace;
    font-size:46px;
    font-weight:500;
    line-height:1;
  }
  .timer-unit{
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
    letter-spacing:.15em;
  }

  .exercise-name{
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-size:22px;
    font-weight:700;
    margin-bottom:4px;
  }
  .exercise-tip{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:8px;
    min-height:16px;
  }
  .info-btn{
    display:block;
    margin:0 auto 16px;
    background:transparent;
    border:none;
    color:var(--lime);
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:2px 6px;
  }

  .dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--panel-line);
    transition:background .2s ease, transform .2s ease;
  }
  .dot.done{ background:var(--lime); }
  .dot.now{ background:var(--orange); transform:scale(1.3); }

  .workout-btns{
    display:flex;
    gap:10px;
  }
  .workout-btns .btn{ flex:1; }
  .btn-pause{
    background:transparent;
    border:1.5px solid var(--panel-line);
    color:var(--text);
  }
  .btn-skip{
    background:transparent;
    border:1.5px solid var(--panel-line);
    color:var(--text-dim);
  }

  /* ---------- FINISH VIEW ---------- */
  .finish-badge{
    width:120px; height:120px;
    margin:6px auto 14px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--lime), #5cc7ff, var(--orange), var(--lime));
    display:flex; align-items:center; justify-content:center;
    animation: badgespin 3s linear infinite, badgepop .5s ease;
  }
  @keyframes badgespin{ to{ filter:hue-rotate(360deg); } }
  @keyframes badgepop{
    0%{ transform:scale(0.3); opacity:0; }
    60%{ transform:scale(1.12); opacity:1; }
    100%{ transform:scale(1); }
  }
  .finish-badge-inner{
    width:100px; height:100px;
    border-radius:50%;
    background:var(--bg2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald', sans-serif;
    font-size:13px;
    font-weight:700;
    text-align:center;
    line-height:1.3;
  }
  .finish-face{
    width:100px; height:100px;
    border-radius:50%;
    object-fit:cover;
    object-position:center 18%;
    background:var(--bg2);
    border:3px solid var(--bg2);
  }
  .finish-title{
    text-align:center;
    font-family:'Oswald', sans-serif;
    font-size:24px;
    font-weight:700;
    margin-bottom:4px;
  }
  .finish-sub{
    text-align:center;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:18px;
  }
  .finish-stats{
    display:flex;
    justify-content:center;
    gap:26px;
    margin-bottom:20px;
  }
  .stat{ text-align:center; }
  .stat b{
    display:block;
    font-family:'DM Mono', monospace;
    font-size:22px;
    color:var(--lime);
  }
  .stat span{
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:.08em;
  }

  .bgm-bar{
    width:100%;
    max-width:440px;
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:12px;
    font-size:12px;
    color:var(--text-dim);
  }
  .bgm-bar button{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid var(--panel-line);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-size:14px;
  }
  .bgm-bar button.on{ background:var(--lime); color:#111; border-color:var(--lime); }

  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--text);
    color:#161d27;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .footnote{
    margin-top:20px;
    font-size:10.5px;
    color:var(--text-dim);
    text-align:center;
    line-height:1.6;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <div class="eyebrow">MEGANE NO OSSAN GYM</div>
  <h1>今日のノルマガチャ</h1>
  <div class="sub">自重トレ3種目・3分ちょい。運まかせでサクッとやるで</div>

  <div class="card">

    <!-- GACHA VIEW -->
    <div class="view active" id="view-gacha">
      <div class="reels" id="reels"></div>
      <div class="gacha-meta">
        <span>推定タイム</span>
        <b id="estTime">--:--</b>
      </div>
      <button class="btn btn-lime" id="gachaBtn">ガチャを回す</button>
      <button class="btn btn-outline" id="startBtn" disabled>この内容でスタート</button>
    </div>

    <!-- WORKOUT VIEW -->
    <div class="view" id="view-workout">
      <div class="phase-label" id="phaseLabel">準備</div>
      <div class="ring-wrap" id="ringWrap">
        <div class="ring-inner">
          <div class="timer-num" id="timerNum">5</div>
          <div class="timer-unit">SEC</div>
        </div>
      </div>
      <div class="exercise-name" id="exName">スタート準備</div>
      <div class="exercise-tip" id="exTip">姿勢整えて、いつでも行けるようにな</div>
      <button class="info-btn" id="infoBtn">やり方を見る</button>
      <div class="dots" id="dots"></div>
      <div class="workout-btns">
        <button class="btn btn-pause" id="pauseBtn">一時停止</button>
        <button class="btn btn-skip" id="skipBtn">スキップ</button>
      </div>
    </div>

    <!-- FINISH VIEW -->
    <div class="view" id="view-finish">
      <div class="finish-badge"><img id="finishFace" class="finish-face" alt="おっさん"></div>
      <div class="finish-title">今日のノルマ、完走!</div>
      <div class="finish-sub">おっさんも見直したで、よう頑張った</div>
      <div class="finish-stats">
        <div class="stat"><b id="finTime">0:00</b><span>TOTAL TIME</span></div>
        <div class="stat"><b id="finCount">0</b><span>累計セッション</span></div>
      </div>
      <button class="btn btn-lime" id="shareBtn">結果をシェア</button>
      <button class="btn btn-outline" id="retryBtn">もう一回ガチャ引く</button>
    </div>

  </div>

  <div class="bgm-bar">
    <button id="bgmToggle">▶</button>
    <span id="bgmLabel">BGM: 未設定(音声ファイルを追加すると再生できます)</span>
  </div>
  <audio id="bgmAudio" loop></audio>

  <div class="footnote">
    自重トレのみ・器具不要。無理のない範囲でな。<br>
    体調悪い時は休むんやで。
  </div>

  <div class="toast" id="toast"></div>

  const EXERCISES = [{"id": "squat", "name": "スクワット", "tip": "膝がつま先より前に出過ぎんように", "desc": "足を肩幅に開いて、椅子に座るイメージでお尻を後ろに引きながら膝を曲げる。太ももが床と平行になるくらいまで沈んだら立ち上がる。"}, {"id": "pushup", "name": "腕立て伏せ", "tip": "きつければ膝つきでOK", "desc": "腕を肩幅より少し広めについて、体を一直線に保ったまま肘を曲げて胸を床に近づける。きつい場合は膝をついてOK。"}, {"id": "plank", "name": "プランク", "tip": "腰が落ちんように一直線キープ", "desc": "うつ伏せの状態から肘とつま先で体を支え、頭からかかとまで一直線をキープ。腰が落ちたり上がったりしないように。"}, {"id": "kneeup", "name": "その場もも上げ", "tip": "リズムよく高く上げる", "desc": "その場で片足ずつ膝を高く引き上げる。腕も一緒に振ってリズムよく、テンポは自分のペースでOK。"}, {"id": "crunch", "name": "クランチ", "tip": "腹筋にしっかり効かせる", "desc": "仰向けに寝て膝を立て、おへそを覗き込むように上半身を軽く丸めて起こす。反動を使わずお腹の力でゆっくりと。"}, {"id": "jj", "name": "ジャンピングジャック", "tip": "腕と脚を大きく開閉", "desc": "両足を揃えて立ち、ジャンプしながら脚を開くと同時に腕を頭上まで振り上げる。着地と同時に元の姿勢に戻す。"}, {"id": "calf", "name": "カーフレイズ", "tip": "かかとをしっかり上げ下げ", "desc": "立った状態でかかとをゆっくり上げてつま先立ちになり、またゆっくり下ろす。ふくらはぎを意識してコントロール。"}, {"id": "hiplift", "name": "ヒップリフト", "tip": "お尻をキュッと締めて持ち上げる", "desc": "仰向けで膝を立て、お尻をキュッと締めながら持ち上げて肩から膝まで一直線にする。ゆっくり下ろして繰り返す。"}, {"id": "lunge", "name": "サイドランジ", "tip": "左右バランスよく沈み込む", "desc": "足を大きく横に開き、片方の膝を曲げて体を沈める。もう片方の足は伸ばしたまま、左右交互に行う。"}, {"id": "wallsit", "name": "ウォールシット", "tip": "壁に背中つけて椅子スタイル", "desc": "壁に背中をつけて、椅子に座るような姿勢で膝を90度に保ったままキープする。太ももの筋肉を意識して。"}, {"id": "backext", "name": "バックエクステンション", "tip": "反りすぎず背中をゆっくり反らす", "desc": "うつ伏せに寝て両手を頭の後ろか横に添え、上半身をゆっくり反らして持ち上げる。反りすぎず、無理のない範囲で。"}, {"id": "step", "name": "その場ステップ", "tip": "軽くリズムよく足踏み", "desc": "その場で軽くリズムよく足踏みする。ウォームアップ感覚で、腕も一緒に振って全身を温める。"}];
  const WORK_SEC = 40;
  const REST_SEC = 15;
  const PREP_SEC = 5;
  const REEL_COUNT = 3;

  const viewGacha = document.getElementById('view-gacha');
  const viewWorkout = document.getElementById('view-workout');
  const viewFinish = document.getElementById('view-finish');

  const reelsEl = document.getElementById('reels');
  const gachaBtn = document.getElementById('gachaBtn');
  const startBtn = document.getElementById('startBtn');
  const estTimeEl = document.getElementById('estTime');

  const phaseLabelEl = document.getElementById('phaseLabel');
  const ringWrapEl = document.getElementById('ringWrap');
  const timerNumEl = document.getElementById('timerNum');
  const exNameEl = document.getElementById('exName');
  const exTipEl = document.getElementById('exTip');
  const infoBtn = document.getElementById('infoBtn');
  const dotsEl = document.getElementById('dots');
  const pauseBtn = document.getElementById('pauseBtn');
  const skipBtn = document.getElementById('skipBtn');

  const finTimeEl = document.getElementById('finTime');
  const finCountEl = document.getElementById('finCount');
  const finishFaceEl = document.getElementById('finishFace');
  const shareBtn = document.getElementById('shareBtn');
  const retryBtn = document.getElementById('retryBtn');

  const bgmToggle = document.getElementById('bgmToggle');
  const bgmAudio = document.getElementById('bgmAudio');
  const toastEl = document.getElementById('toast');

  let chosen = [];
  let phases = [];
  let phaseIndex = 0;
  let remaining = 0;
  let paused = false;
  let tickHandle = null;
  let totalElapsed = 0;
  let sessionCount = parseInt(localStorage.getItem('ossan_gym_sessions') || '0', 10);

  function showView(id){
    [viewGacha, viewWorkout, viewFinish].forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ---------- Web Audio SE ----------
  let actx;
  function ensureAudio(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playTick(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 1000;
      g.gain.setValueAtTime(0.06, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.06);
    }catch(e){}
  }
  function playWhistleStart(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(700, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.15);
      g.gain.setValueAtTime(0.08, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.22);
    }catch(e){}
  }
  function playBuzzRest(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(320, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.3);
      g.gain.setValueAtTime(0.09, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.35);
    }catch(e){}
  }
  function playFanfare(){
    try{
      const ctx = ensureAudio();
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const t = ctx.currentTime + idx * 0.12;
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'triangle'; o.frequency.value = freq;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.12, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.47);
      });
    }catch(e){}
  }

  // ---------- Gacha (slot reels) ----------
  function buildReel(index){
    const wrap = document.createElement('div');
    wrap.className = 'reel';
    wrap.id = 'reel-' + index;
    const strip = document.createElement('div');
    strip.className = 'reel-strip';
    // fill with shuffled names for spin illusion, repeated
    const shuffled = [...EXERCISES].sort(() => Math.random()-0.5);
    for (let r=0;r<3;r++){
      shuffled.forEach(ex => {
        const cell = document.createElement('div');
        cell.className = 'reel-cell';
        cell.textContent = ex.name;
        strip.appendChild(cell);
      });
    }
    wrap.appendChild(strip);
    return wrap;
  }

  function initReels(){
    reelsEl.innerHTML = '';
    for (let i=0;i<REEL_COUNT;i++){
      reelsEl.appendChild(buildReel(i));
    }
  }
  initReels();

  function pickThree(){
    const pool = [...EXERCISES].sort(() => Math.random()-0.5);
    return pool.slice(0, REEL_COUNT);
  }

  function spinGacha(){
    ensureAudio();
    gachaBtn.disabled = true;
    startBtn.disabled = true;
    estTimeEl.textContent = '--:--';
    chosen = pickThree();

    const reels = [0,1,2].map(i => document.getElementById('reel-' + i));
    reels.forEach(r => { r.classList.add('spinning'); r.classList.remove('locked'); });

    reels.forEach((reel, i) => {
      const stopDelay = 700 + i * 500;
      setTimeout(() => {
        reel.classList.remove('spinning');
        reel.classList.add('locked');
        const strip = reel.querySelector('.reel-strip');
        strip.innerHTML = '';
        const cell = document.createElement('div');
        cell.className = 'reel-cell';
        cell.textContent = chosen[i].name;
        strip.appendChild(cell);
        playTick();

        if (i === reels.length - 1){
          setTimeout(() => {
            gachaBtn.disabled = false;
            startBtn.disabled = false;
            const total = PREP_SEC + chosen.length*WORK_SEC + (chosen.length-1)*REST_SEC;
            const m = Math.floor(total/60), s = total%60;
            estTimeEl.textContent = m + ':' + String(s).padStart(2,'0');
          }, 200);
        }
      }, stopDelay);
    });
  }
  gachaBtn.addEventListener('click', spinGacha);

  // ---------- Workout flow ----------
  function buildPhases(){
    const p = [{ type:'prep', name:'スタート準備', tip:'姿勢整えて、いつでも行けるようにな', sec:PREP_SEC, exIndex:-1 }];
    chosen.forEach((ex, i) => {
      p.push({ type:'work', name:ex.name, tip:ex.tip, sec:WORK_SEC, exIndex:i });
      if (i < chosen.length-1){
        p.push({ type:'rest', name:'休憩', tip:'次は「' + chosen[i+1].name + '」やで', sec:REST_SEC, exIndex:i });
      }
    });
    return p;
  }

  function buildDots(){
    dotsEl.innerHTML = '';
    chosen.forEach((ex, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      d.id = 'dot-' + i;
      dotsEl.appendChild(d);
    });
  }

  function updateDots(){
    chosen.forEach((ex, i) => {
      const d = document.getElementById('dot-' + i);
      d.className = 'dot';
      const cur = phases[phaseIndex];
      if (cur.exIndex > i || (cur.type !== 'prep' && cur.exIndex === i && cur.type === 'rest')) {
        d.classList.add('done');
      } else if (cur.exIndex === i && cur.type === 'work') {
        d.classList.add('now');
      }
    });
  }

  function startWorkout(){
    phases = buildPhases();
    phaseIndex = 0;
    totalElapsed = 0;
    paused = false;
    pauseBtn.textContent = '一時停止';
    buildDots();
    showView('view-workout');
    enterPhase();
  }
  startBtn.addEventListener('click', () => { ensureAudio(); startWorkout(); });

  let showingDesc = false;

  function enterPhase(){
    const ph = phases[phaseIndex];
    remaining = ph.sec;
    exNameEl.textContent = ph.name;
    exTipEl.textContent = ph.tip;
    showingDesc = false;
    infoBtn.textContent = 'やり方を見る';
    infoBtn.style.display = (ph.type === 'work') ? 'block' : 'none';
    updateDots();

    if (ph.type === 'work'){
      phaseLabelEl.textContent = 'トレーニング中';
      phaseLabelEl.classList.add('work');
      ringWrapEl.classList.remove('rest');
      playWhistleStart();
    } else if (ph.type === 'rest'){
      phaseLabelEl.textContent = '休憩';
      phaseLabelEl.classList.remove('work');
      ringWrapEl.classList.add('rest');
      playBuzzRest();
    } else {
      phaseLabelEl.textContent = '準備';
      phaseLabelEl.classList.remove('work');
      ringWrapEl.classList.remove('rest');
    }
    renderTick();
    if (tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(tick, 1000);
  }

  function renderTick(){
    const ph = phases[phaseIndex];
    timerNumEl.textContent = remaining;
    const pct = Math.round(((ph.sec - remaining) / ph.sec) * 100);
    ringWrapEl.style.setProperty('--p', pct);
  }

  function tick(){
    if (paused) return;
    remaining--;
    totalElapsed++;
    if (remaining <= 0){
      if (remaining === 0){
        renderTick();
      }
      nextPhase();
      return;
    }
    if (remaining <= 3 && remaining > 0) playTick();
    renderTick();
  }

  function nextPhase(){
    phaseIndex++;
    if (phaseIndex >= phases.length){
      clearInterval(tickHandle);
      finishWorkout();
      return;
    }
    enterPhase();
  }

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '再開する' : '一時停止';
  });

  infoBtn.addEventListener('click', () => {
    const ph = phases[phaseIndex];
    if (ph.exIndex < 0) return;
    const ex = chosen[ph.exIndex];
    showingDesc = !showingDesc;
    exTipEl.textContent = showingDesc ? ex.desc : ph.tip;
    infoBtn.textContent = showingDesc ? '閉じる' : 'やり方を見る';
  });

  skipBtn.addEventListener('click', () => {
    clearInterval(tickHandle);
    nextPhase();
  });

  function finishWorkout(){
    playFanfare();
    sessionCount++;
    localStorage.setItem('ossan_gym_sessions', String(sessionCount));
    const m = Math.floor(totalElapsed/60), s = totalElapsed%60;
    finTimeEl.textContent = m + ':' + String(s).padStart(2,'0');
    finCountEl.textContent = sessionCount;
    finishFaceEl.src = FACE_SURPRISED;
    showView('view-finish');
  }

  retryBtn.addEventListener('click', () => {
    initReels();
    estTimeEl.textContent = '--:--';
    startBtn.disabled = true;
    showView('view-gacha');
  });

  shareBtn.addEventListener('click', async () => {
    const names = chosen.map(e => e.name).join('・');
    const shareText = 'おっさんジムで今日のノルマ完走! (' + names + ') ' + finTimeEl.textContent;
    const url = location.href;
    if (navigator.share){
      try{ await navigator.share({ title:'おっさんジム', text:shareText, url }); }catch(e){}
    } else {
      try{
        await navigator.clipboard.writeText(shareText + ' ' + url);
        showToast('コピーしたで📋');
      }catch(e){ showToast('共有に対応してへんブラウザや…'); }
    }
  });

  // ---------- BGM hook (add your own file later) ----------
  // 使い方: bgmAudio.src に音声ファイルのURL(またはbase64)をセットするだけでOK
  // 例: document.getElementById('bgmAudio').src = 'data:audio/mp3;base64,....';
  let bgmOn = false;
  bgmToggle.addEventListener('click', () => {
    if (!bgmAudio.src){
      showToast('BGMファイル未設定やで(コードのbgmAudio.srcにセットしてな)');
      return;
    }
    bgmOn = !bgmOn;
    bgmToggle.classList.toggle('on', bgmOn);
    bgmToggle.textContent = bgmOn ? '❚❚' : '▶';
    if (bgmOn) bgmAudio.play(); else bgmAudio.pause();
  });
</script>
