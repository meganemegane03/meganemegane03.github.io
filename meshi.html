<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>晩ごはんルーレット</title>

<!-- OGP -->
<meta property="og:title" content="晩ごはんルーレット">
<meta property="og:description" content="カテゴリ・気分・メニューをルーレットで決める、晩ごはん決定アプリ">
<meta property="og:url" content="https://meganemegane03.github.io/meshi.html">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">

<!-- PWA -->
<link rel="manifest" href="meshi-manifest.json">
<meta name="theme-color" content="#2b1810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="メシルーレット">
<link rel="apple-touch-icon" href="normal-icon-192.JPG">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2b1810; --bg2:#1c0f0a;
    --panel:#3a2418; --panel-line:#5a3a26;
    --red:#e6543f; --red-dark:#b83a28;
    --gold:#f2b544; --gold-dark:#c9902a;
    --green:#6ab04c;
    --text:#fff3e6; --text-dim:#c9a888;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(circle at 20% -10%, rgba(242,181,68,0.14), transparent 45%), linear-gradient(180deg, var(--bg), var(--bg2));
    color:var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 46px;
  }
  .eyebrow{ font-size:11px; letter-spacing:.28em; color:var(--gold); font-weight:700; }
  h1{ font-family:'Yomogi', cursive; font-size:27px; margin:6px 0 2px; text-align:center; }
  .sub{ font-size:12.5px; color:var(--text-dim); margin-bottom:16px; text-align:center; }

  .mode-toggle{
    display:flex; gap:6px; width:100%; max-width:420px; margin-bottom:16px;
  }
  .mode-btn{
    flex:1; font-size:13px; font-weight:700; padding:10px 4px;
    border-radius:10px; border:1.5px solid var(--panel-line);
    background:var(--panel); color:var(--text-dim); cursor:pointer;
  }
  .mode-btn.active{ background:var(--red); color:#fff; border-color:var(--red); }

  .card{
    width:100%; max-width:420px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:22px 18px 22px;
    box-shadow:0 18px 40px rgba(0,0,0,0.4);
    position:relative;
  }

  .wheel-wrap{
    position:relative;
    width:240px; height:240px;
    margin:0 auto 18px;
  }
  .wheel{
    width:100%; height:100%;
    border-radius:50%;
    position:relative;
    transition: transform 3s cubic-bezier(.17,.67,.16,.99);
    box-shadow:0 0 0 6px var(--gold), 0 10px 24px rgba(0,0,0,0.4);
    overflow:hidden;
  }
  .wheel-label{
    position:absolute;
    left:50%; top:50%;
    transform-origin:0 0;
    font-size:13px;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,0.5);
    white-space:nowrap;
  }
  .pointer{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:0; height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:20px solid var(--gold);
    z-index:5;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }

  .step-label{
    text-align:center; font-family:'Yomogi', cursive; font-size:17px;
    margin-bottom:14px;
  }

  .btn{
    width:100%;
    font-family:'Yomogi', cursive;
    font-size:17px; font-weight:700;
    border:none; border-radius:50px;
    padding:14px 10px;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease, opacity .2s ease;
  }
  .btn-main{
    color:#fff;
    background:linear-gradient(180deg, var(--red), var(--red-dark));
    box-shadow:0 5px 0 #7d2317, 0 10px 18px rgba(0,0,0,0.3);
  }
  .btn-main:active{ transform:translateY(5px); box-shadow:0 0 0 #7d2317; }
  .btn-outline{
    color:var(--text); background:transparent; border:1.5px solid var(--panel-line);
    margin-top:10px;
  }
  .btn-outline:active{ transform:translateY(2px); }
  .btn[disabled]{ opacity:.45; pointer-events:none; }

  .view{ display:none; }
  .view.active{ display:block; }

  .picked-row{
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .picked-chip{
    background:rgba(255,255,255,0.08);
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:5px 12px;
    font-size:12px;
    color:var(--text-dim);
  }
  .picked-chip.on{ color:var(--gold); border-color:var(--gold); }

  .result-title{ font-family:'Yomogi', cursive; font-size:24px; text-align:center; margin-bottom:6px; }
  .result-sub{ text-align:center; font-size:12.5px; color:var(--text-dim); margin-bottom:16px; }
  .ingredient-box{
    background:rgba(255,255,255,0.06); border:1px solid var(--panel-line);
    border-radius:14px; padding:14px 16px; margin-bottom:18px; font-size:13.5px; line-height:1.7;
  }
  .ingredient-box b{ display:block; font-size:10.5px; color:var(--gold); letter-spacing:.1em; margin-bottom:4px; }

  .week-table{ width:100%; border-collapse:collapse; margin-bottom:16px; font-size:13px; }
  .week-table td{ padding:8px 6px; border-bottom:1px solid var(--panel-line); }
  .week-table td:first-child{ color:var(--gold); font-weight:700; width:44px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--text); color:#2b1810; padding:10px 18px; border-radius:30px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .footnote{ margin-top:16px; font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.6; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <div class="eyebrow">MEGANE NO OSSAN MESHI</div>
  <h1>晩ごはんルーレット</h1>
  <div class="sub">回して決める、今日のメシ</div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="modeCook">自炊する</button>
    <button class="mode-btn" id="modeOut">外食にする</button>
  </div>

  <div class="card">

    <div class="view active" id="view-main">
      <div class="picked-row" id="pickedRow">
        <div class="picked-chip" id="chipCat">カテゴリ</div>
        <div class="picked-chip" id="chipMood">気分</div>
        <div class="picked-chip" id="chipDish">メニュー</div>
      </div>
      <div class="step-label" id="stepLabel">まずはカテゴリから回すで</div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <button class="btn btn-main" id="spinBtn">ルーレットを回す</button>
      <button class="btn btn-outline" id="weekBtn">1週間分をまとめて決める</button>
    </div>

    <div class="view" id="view-result">
      <div class="result-title" id="resultTitle">豚の生姜焼き</div>
      <div class="result-sub" id="resultSub">和食 ・ がっつり</div>
      <div class="ingredient-box" id="ingredientBox">
        <b>主な材料</b>
        <span id="ingredientText"></span>
      </div>
      <button class="btn btn-main" id="shareBtn">結果をシェア</button>
      <button class="btn btn-outline" id="retryBtn">もう一回回す</button>
    </div>

    <div class="view" id="view-week">
      <div class="result-title" style="font-size:20px;">今週の献立</div>
      <table class="week-table" id="weekTable"></table>
      <button class="btn btn-main" id="weekShareBtn">1週間分をシェア</button>
      <button class="btn btn-outline" id="weekBackBtn">戻る</button>
    </div>

  </div>

  <div class="footnote">
    材料はあくまで目安やで。冷蔵庫の中身とも相談してな。
  </div>

  <div class="toast" id="toast"></div>

<script>
  const DATA = {"categories": ["和食", "洋食", "中華", "ヘルシー"], "moods": ["がっつり", "あっさり"], "dishes": {"和食|がっつり": [{"n": "豚の生姜焼き", "i": "豚肉/玉ねぎ/生姜/醤油/みりん"}, {"n": "カツ丼", "i": "豚カツ/卵/玉ねぎ/だし/ご飯"}, {"n": "すき焼き", "i": "牛肉/白菜/豆腐/しらたき/割り下"}], "和食|あっさり": [{"n": "湯豆腐", "i": "豆腐/昆布/ポン酢/薬味"}, {"n": "塩鮭定食", "i": "鮭/大根おろし/ご飯/味噌汁"}, {"n": "ほうれん草の煮浸し", "i": "ほうれん草/だし/醤油/油揚げ"}], "洋食|がっつり": [{"n": "ハンバーグ", "i": "合い挽き肉/玉ねぎ/卵/パン粉/デミグラスソース"}, {"n": "オムライス", "i": "卵/ご飯/鶏肉/ケチャップ/玉ねぎ"}, {"n": "ビーフシチュー", "i": "牛肉/にんじん/じゃがいも/玉ねぎ/シチュールー"}], "洋食|あっさり": [{"n": "カルパッチョ", "i": "白身魚 or サーモン/オリーブオイル/レモン/塩"}, {"n": "チキンのハーブ焼き", "i": "鶏むね肉/ハーブ/オリーブオイル/塩胡椒"}, {"n": "野菜たっぷりミネストローネ", "i": "トマト缶/玉ねぎ/にんじん/セロリ/豆"}], "中華|がっつり": [{"n": "回鍋肉", "i": "豚肉/キャベツ/ピーマン/甜麺醤"}, {"n": "麻婆豆腐", "i": "豆腐/挽き肉/豆板醤/ねぎ"}, {"n": "酢豚", "i": "豚肉/パイナップル/ピーマン/玉ねぎ/酢豚ソース"}], "中華|あっさり": [{"n": "中華風冷奴", "i": "豆腐/ザーサイ/ねぎ/ごま油"}, {"n": "野菜炒め", "i": "キャベツ/もやし/にんじん/豚肉少々/塩胡椒"}, {"n": "春雨サラダ", "i": "春雨/きゅうり/ハム/中華ドレッシング"}], "ヘルシー|がっつり": [{"n": "鶏むね肉のグリル", "i": "鶏むね肉/スパイス/オリーブオイル"}, {"n": "豆腐ハンバーグ", "i": "豆腐/鶏挽き肉/玉ねぎ/大根おろし"}, {"n": "サラダチキン丼", "i": "サラダチキン/ご飯 or 雑穀米/温泉卵/野菜"}], "ヘルシー|あっさり": [{"n": "野菜たっぷりスープ", "i": "キャベツ/にんじん/玉ねぎ/コンソメ"}, {"n": "冷しゃぶサラダ", "i": "豚しゃぶしゃぶ肉/レタス/トマト/ポン酢"}, {"n": "蒸し鶏と温野菜", "i": "鶏むね肉/ブロッコリー/にんじん/ポン酢 or ごまだれ"}]}};
  const CATS = DATA.categories;
  const MOODS = DATA.moods;

  let eatOut = false;
  const modeCook = document.getElementById('modeCook');
  const modeOut = document.getElementById('modeOut');
  modeCook.addEventListener('click', () => { eatOut = false; modeCook.classList.add('active'); modeOut.classList.remove('active'); resetFlow(); });
  modeOut.addEventListener('click', () => { eatOut = true; modeOut.classList.add('active'); modeCook.classList.remove('active'); resetFlow(); });

  const viewMain = document.getElementById('view-main');
  const viewResult = document.getElementById('view-result');
  const viewWeek = document.getElementById('view-week');

  const wheel = document.getElementById('wheel');
  const spinBtn = document.getElementById('spinBtn');
  const weekBtn = document.getElementById('weekBtn');
  const stepLabel = document.getElementById('stepLabel');
  const chipCat = document.getElementById('chipCat');
  const chipMood = document.getElementById('chipMood');
  const chipDish = document.getElementById('chipDish');

  const resultTitle = document.getElementById('resultTitle');
  const resultSub = document.getElementById('resultSub');
  const ingredientBox = document.getElementById('ingredientBox');
  const ingredientText = document.getElementById('ingredientText');
  const shareBtn = document.getElementById('shareBtn');
  const retryBtn = document.getElementById('retryBtn');

  const weekTable = document.getElementById('weekTable');
  const weekShareBtn = document.getElementById('weekShareBtn');
  const weekBackBtn = document.getElementById('weekBackBtn');
  const toastEl = document.getElementById('toast');

  const WHEEL_COLORS = ['#e6543f','#f2b544','#6ab04c','#4a90c9','#a86bd8','#e07b3d'];

  let stage = 0; // 0=category, 1=mood, 2=dish
  let pickedCat = null, pickedMood = null, pickedDish = null;
  let currentRotation = 0;

  function showView(id){
    [viewMain, viewResult, viewWeek].forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  let actx;
  function ensureAudio(){
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playTick(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 900;
      g.gain.setValueAtTime(0.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.05);
    }catch(e){}
  }
  function playChime(){
    try{
      const ctx = ensureAudio();
      [880, 1108.7, 1318.5].forEach((f, idx) => {
        const t = ctx.currentTime + idx * 0.1;
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.42);
      });
    }catch(e){}
  }

  function getRecentDishes(){
    return JSON.parse(localStorage.getItem('ossan_meshi_recent') || '[]');
  }
  function pushRecentDish(name){
    let recent = getRecentDishes();
    recent.unshift(name);
    recent = recent.slice(0, 4);
    localStorage.setItem('ossan_meshi_recent', JSON.stringify(recent));
  }

  function buildWheel(labels){
    wheel.innerHTML = '';
    const n = labels.length;
    const seg = 360 / n;
    let gradient = 'conic-gradient(';
    labels.forEach((l, i) => {
      const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
      gradient += color + ' ' + (i*seg) + 'deg ' + ((i+1)*seg) + 'deg' + (i < n-1 ? ', ' : '');
    });
    gradient += ')';
    wheel.style.background = gradient;

    labels.forEach((l, i) => {
      const mid = i*seg + seg/2;
      const label = document.createElement('div');
      label.className = 'wheel-label';
      label.textContent = l;
      const rad = 78;
      const rot = mid - 90;
      label.style.transform = 'rotate(' + rot + 'deg) translate(' + rad + 'px) rotate(' + (90) + 'deg) translateX(-50%)';
      wheel.appendChild(label);
    });
  }

  function spinToIndex(n, index, onDone){
    const seg = 360 / n;
    const target = 360*5 + (360 - (index*seg + seg/2));
    currentRotation += (target - (currentRotation % 360));
    wheel.style.transition = 'none';
    void wheel.offsetWidth;
    wheel.style.transition = 'transform 3s cubic-bezier(.17,.67,.16,.99)';
    wheel.style.transform = 'rotate(' + currentRotation + 'deg)';
    const tickHandle = setInterval(playTick, 110);
    setTimeout(() => {
      clearInterval(tickHandle);
      playChime();
      onDone && onDone();
    }, 3000);
  }

  function resetFlow(){
    stage = 0;
    pickedCat = null; pickedMood = null; pickedDish = null;
    chipCat.textContent = 'カテゴリ'; chipCat.classList.remove('on');
    chipMood.textContent = '気分'; chipMood.classList.remove('on');
    chipDish.textContent = 'メニュー'; chipDish.classList.remove('on');
    spinBtn.disabled = false;
    spinBtn.textContent = 'ルーレットを回す';
    stepLabel.textContent = 'まずはカテゴリから回すで';
    buildWheel(CATS);
    showView('view-main');
  }
  resetFlow();

  spinBtn.addEventListener('click', () => {
    ensureAudio();
    spinBtn.disabled = true;

    if (stage === 0){
      const idx = Math.floor(Math.random()*CATS.length);
      spinToIndex(CATS.length, idx, () => {
        pickedCat = CATS[idx];
        chipCat.textContent = pickedCat; chipCat.classList.add('on');
        spinBtn.disabled = false;
        if (eatOut){
          // 外食モードはカテゴリだけで完結
          showEatOutResult();
        } else {
          stage = 1;
          stepLabel.textContent = '次は気分(がっつり/あっさり)やで';
          buildWheel(MOODS);
        }
      });
    } else if (stage === 1){
      const idx = Math.floor(Math.random()*MOODS.length);
      spinToIndex(MOODS.length, idx, () => {
        pickedMood = MOODS[idx];
        chipMood.textContent = pickedMood; chipMood.classList.add('on');
        spinBtn.disabled = false;
        stage = 2;
        stepLabel.textContent = '最後にメニューを決めるで';
        const key = pickedCat + '|' + pickedMood;
        const pool = DATA.dishes[key];
        buildWheel(pool.map(d => d.n));
      });
    } else if (stage === 2){
      const key = pickedCat + '|' + pickedMood;
      const pool = DATA.dishes[key];
      const recent = getRecentDishes();
      let candidates = pool.filter(d => !recent.includes(d.n));
      if (candidates.length === 0) candidates = pool;
      const chosen = candidates[Math.floor(Math.random()*candidates.length)];
      const idx = pool.findIndex(d => d.n === chosen.n);
      spinToIndex(pool.length, idx, () => {
        pickedDish = chosen;
        chipDish.textContent = pickedDish.n; chipDish.classList.add('on');
        pushRecentDish(pickedDish.n);
        showResult();
      });
    }
  });

  function showResult(){
    resultTitle.textContent = pickedDish.n;
    resultSub.textContent = pickedCat + ' ・ ' + pickedMood;
    ingredientText.textContent = pickedDish.i;
    ingredientBox.style.display = 'block';
    showView('view-result');
  }
  function showEatOutResult(){
    resultTitle.textContent = '今日は「' + pickedCat + '」系で外食や';
    resultSub.textContent = '外食モード';
    ingredientBox.style.display = 'none';
    showView('view-result');
  }

  retryBtn.addEventListener('click', () => { resetFlow(); });

  shareBtn.addEventListener('click', async () => {
    const shareText = eatOut
      ? '今日の晩ごはんは「' + pickedCat + '系の外食」に決まったで(晩ごはんルーレット)'
      : '今日の晩ごはんは「' + pickedDish.n + '」に決まったで(' + pickedCat + '・' + pickedMood + ')';
    const url = location.href;
    if (navigator.share){
      try{ await navigator.share({ title:'晩ごはんルーレット', text:shareText, url }); }catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(shareText + ' ' + url); showToast('コピーしたで📋'); }
      catch(e){ showToast('共有に対応してへんブラウザや…'); }
    }
  });

  // ---------- Week planner ----------
  const DAY_NAMES = ['月','火','水','木','金','土','日'];
  let weekResult = [];

  weekBtn.addEventListener('click', () => {
    ensureAudio();
    let recent = getRecentDishes();
    weekResult = [];
    for (let i=0;i<7;i++){
      const cat = CATS[Math.floor(Math.random()*CATS.length)];
      if (eatOut){
        weekResult.push({ day: DAY_NAMES[i], cat, mood:null, dish:null });
        continue;
      }
      const mood = MOODS[Math.floor(Math.random()*MOODS.length)];
      const pool = DATA.dishes[cat + '|' + mood];
      let candidates = pool.filter(d => !recent.includes(d.n));
      if (candidates.length === 0) candidates = pool;
      const dish = candidates[Math.floor(Math.random()*candidates.length)];
      recent = [dish.n, ...recent].slice(0,4);
      weekResult.push({ day: DAY_NAMES[i], cat, mood, dish: dish.n });
    }
    renderWeekTable();
    playChime();
    showView('view-week');
  });

  function renderWeekTable(){
    weekTable.innerHTML = '';
    weekResult.forEach(r => {
      const tr = document.createElement('tr');
      const tdDay = document.createElement('td');
      tdDay.textContent = r.day;
      const tdContent = document.createElement('td');
      tdContent.textContent = eatOut
        ? (r.cat + '系で外食')
        : (r.dish + '(' + r.cat + '・' + r.mood + ')');
      tr.appendChild(tdDay); tr.appendChild(tdContent);
      weekTable.appendChild(tr);
    });
  }

  weekBackBtn.addEventListener('click', () => { resetFlow(); });

  weekShareBtn.addEventListener('click', async () => {
    const lines = weekResult.map(r => r.day + ':' + (eatOut ? (r.cat+'系で外食') : r.dish));
    const shareText = '今週の献立決めたで📅\n' + lines.join('\n');
    const url = location.href;
    if (navigator.share){
      try{ await navigator.share({ title:'晩ごはんルーレット(1週間分)', text:shareText, url }); }catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(shareText + ' ' + url); showToast('コピーしたで📋'); }
      catch(e){ showToast('共有に対応してへんブラウザや…'); }
    }
  });
</script>
</body>
</html>
