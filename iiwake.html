<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おっさんの言い訳製造機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efeee1;
    --paper2:#e8e6d6;
    --rule:#a9c2d6;
    --rule-soft:#c7d8e4;
    --ink:#242c3d;
    --ink-soft:#5b6478;
    --hanko:#b23a2e;
    --hanko-dark:#8c2a20;
    --mustard:#e3a73c;
    --mustard-dark:#c78a24;
    --tab-off:#d8d5c2;
    --shadow: 0 10px 26px rgba(36,44,61,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(135deg, rgba(169,194,214,0.10) 0px, rgba(169,194,214,0.10) 2px, transparent 2px, transparent 26px),
      linear-gradient(180deg, #dfe3d0 0%, #eceada 40%, #f2f0e2 100%);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 40px;
  }

  .header{
    width:100%;
    max-width:460px;
    text-align:center;
    margin-bottom:10px;
    position:relative;
  }
  .header .eyebrow{
    font-size:12px;
    letter-spacing:.24em;
    color:var(--ink-soft);
    font-weight:700;
  }
  .header h1{
    font-family:'Yomogi', cursive;
    font-size:34px;
    line-height:1.25;
    margin:4px 0 2px;
    color:var(--ink);
    transform:rotate(-1deg);
  }
  .header .sub{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .board{
    width:100%;
    max-width:460px;
    position:relative;
    margin-top:22px;
  }

  /* clipboard clip */
  .clip{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:96px;
    height:34px;
    background:linear-gradient(180deg,#c9cdd6,#9aa0ac);
    border-radius:8px;
    box-shadow:0 4px 8px rgba(0,0,0,0.25), inset 0 1px 2px rgba(255,255,255,0.5);
    z-index:5;
  }
  .clip::after{
    content:"";
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:60px; height:14px;
    background:#eceada;
    border-radius:3px;
  }

  .paper{
    position:relative;
    margin-top:20px;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--rule-soft) 27px, var(--rule-soft) 28px);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:26px 20px 22px;
    overflow:hidden;
  }
  .paper::before{
    content:"";
    position:absolute;
    left:34px; top:0; bottom:0;
    width:2px;
    background:var(--hanko);
    opacity:.35;
  }

  .tabs{
    display:flex;
    gap:5px;
    margin:0 0 16px 30px;
    flex-wrap:wrap;
  }
  .tab{
    font-family:'Yomogi', cursive;
    font-size:14px;
    padding:7px 10px 6px;
    background:var(--tab-off);
    color:var(--ink-soft);
    border-radius:7px 7px 0 0;
    cursor:pointer;
    user-select:none;
    border:1px solid rgba(36,44,61,0.12);
    border-bottom:none;
    transition:transform .15s ease, background .15s ease, color .15s ease;
    transform:translateY(4px);
  }
  .tab.active{
    background:var(--mustard);
    color:var(--ink);
    transform:translateY(0);
    box-shadow:0 -2px 6px rgba(0,0,0,0.08);
    font-weight:700;
  }
  .tab:active{ transform:translateY(2px) scale(0.97); }

  .stage{
    margin-left:30px;
    min-height:150px;
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:14px;
  }

  .face-wrap{
    flex:0 0 auto;
    width:88px;
    height:88px;
    border-radius:50%;
    overflow:hidden;
    background:#fff;
    border:3px solid var(--ink);
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .face-wrap img{
    width:120%;
    height:120%;
    object-fit:cover;
    object-position:center 18%;
  }
  .face-wrap.shake{ animation: shake .5s ease; }
  .face-wrap.pop{ animation: pop .5s ease; }
  @keyframes shake{
    0%,100%{transform:rotate(0deg);}
    20%{transform:rotate(-8deg);}
    40%{transform:rotate(7deg);}
    60%{transform:rotate(-5deg);}
    80%{transform:rotate(4deg);}
  }
  @keyframes pop{
    0%{transform:scale(1);}
    35%{transform:scale(1.14) rotate(-4deg);}
    70%{transform:scale(0.96) rotate(3deg);}
    100%{transform:scale(1);}
  }

  .textbox{
    flex:1;
    min-height:110px;
    font-size:16.5px;
    line-height:1.75;
    padding-top:4px;
    word-break:break-word;
  }
  .textbox .placeholder{
    color:var(--ink-soft);
    font-size:14px;
  }
  .textbox .caret{
    display:inline-block;
    width:2px;
    height:1em;
    background:var(--ink);
    vertical-align:-2px;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .verdict-row{
    margin-left:30px;
    margin-top:16px;
    min-height:46px;
    display:flex;
    justify-content:flex-end;
    padding-right:4px;
  }
  .verdict{
    font-family:'Yomogi', cursive;
    font-size:19px;
    font-weight:700;
    color:var(--hanko);
    border:3.5px solid var(--hanko);
    border-radius:10px;
    padding:5px 12px;
    transform:rotate(-6deg) scale(0);
    opacity:0;
    background:rgba(255,255,255,0.5);
    mix-blend-mode:multiply;
    pointer-events:none;
    white-space:nowrap;
  }
  .verdict.show{
    animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes stamp{
    0%{ transform:rotate(-6deg) scale(2.6); opacity:0; }
    55%{ transform:rotate(-9deg) scale(0.92); opacity:1; }
    75%{ transform:rotate(-5deg) scale(1.06); }
    100%{ transform:rotate(-6deg) scale(1); opacity:1; }
  }

  .counter{
    margin-left:30px;
    margin-top:14px;
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .counter b{ color:var(--ink); font-size:14px; }

  .btn-row{
    margin-top:20px;
    display:flex;
    gap:10px;
    padding:0 2px;
  }

  .btn-main{
    flex:1;
    position:relative;
    font-family:'Yomogi', cursive;
    font-size:19px;
    font-weight:700;
    color:#fff8ec;
    background:linear-gradient(180deg, var(--hanko) 0%, var(--hanko-dark) 100%);
    border:none;
    border-radius:50px;
    padding:15px 10px;
    box-shadow:0 6px 0 #6f1f18, 0 10px 16px rgba(0,0,0,0.25);
    cursor:pointer;
    letter-spacing:.03em;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-main:active{
    transform:translateY(6px);
    box-shadow:0 0 0 #6f1f18, 0 4px 8px rgba(0,0,0,0.2);
  }
  .btn-share{
    flex:0 0 auto;
    width:52px;
    font-size:20px;
    background:var(--mustard);
    color:var(--ink);
    border:none;
    border-radius:50px;
    box-shadow:0 6px 0 var(--mustard-dark), 0 10px 16px rgba(0,0,0,0.18);
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-share:active{
    transform:translateY(6px);
    box-shadow:0 0 0 var(--mustard-dark);
  }

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .foot-stamp{
    margin-top:26px;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }
  .foot-stamp span{
    display:inline-block;
    border:1.5px solid var(--hanko);
    color:var(--hanko);
    border-radius:6px;
    padding:2px 8px;
    transform:rotate(-3deg);
    font-family:'Yomogi', cursive;
    margin-top:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="eyebrow">MEGANE NO OSSAN PRESENTS</div>
    <h1>言い訳製造機</h1>
    <div class="sub">おっさんが本気で考えた、しょうもない言い訳 全120本</div>
  </div>

  <div class="board">
    <div class="clip"></div>
    <div class="paper">
      <div class="tabs" id="tabs"></div>

      <div class="stage">
        <div class="face-wrap" id="faceWrap">
          <img id="faceImg" src="" alt="おっさんの顔">
        </div>
        <div class="textbox" id="textbox">
          <span class="placeholder">タブでジャンル選んで、下のボタン押してや〜</span>
        </div>
      </div>

      <div class="verdict-row"><div class="verdict" id="verdict"></div></div>

      <div class="counter">今まで捻り出した言い訳：<b id="count">0</b>本</div>

      <div class="btn-row">
        <button class="btn-main" id="genBtn">言い訳をひねり出す</button>
        <button class="btn-share" id="shareBtn" title="シェア">↗</button>
      </div>
    </div>

    <div class="foot-stamp">
      これはネタです。本気にせんといてな<br>
      <span>編集長 検閲済</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  };

  const CAT_LABEL = {
    "遅刻": "遅刻",
    "仕事サボり": "サボり",
    "宿題締切": "締切",
    "既読無視": "既読無視",
    "忘れ物": "忘れ物"
  };

  const VERDICT_NORMAL = ["セーフ", "大目に見たる", "保留", "次は無いで"];
  const VERDICT_YABAI = ["アウト!!", "始末書コース", "説教確定", "一発レッドカード"];

  let currentCat = EXCUSES.categories[0];
  let count = parseInt(localStorage.getItem('ossan_iiwake_count') || '0', 10);
  let typing = false;

  const tabsEl = document.getElementById('tabs');
  const textboxEl = document.getElementById('textbox');
  const faceWrapEl = document.getElementById('faceWrap');
  const faceImgEl = document.getElementById('faceImg');
  const verdictEl = document.getElementById('verdict');
  const countEl = document.getElementById('count');
  const genBtn = document.getElementById('genBtn');
  const shareBtn = document.getElementById('shareBtn');
  const toastEl = document.getElementById('toast');

  let lastExcuseText = "";

  function buildTabs(){
    tabsEl.innerHTML = "";
    EXCUSES.categories.forEach(cat => {
      const el = document.createElement('div');
      el.className = 'tab' + (cat === currentCat ? ' active' : '');
      el.textContent = CAT_LABEL[cat] || cat;
      el.addEventListener('click', () => {
        if (typing) return;
        currentCat = cat;
        buildTabs();
        playClick();
      });
      tabsEl.appendChild(el);
    });
  }

  countEl.textContent = count;

  // ---- Web Audio synthesized SE ----
  let actx;
  function ensureAudio(){
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  function playClick(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.value = 900;
      g.gain.setValueAtTime(0.05, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.05);
    }catch(e){}
  }

  function playType(){
    try{
      const ctx = ensureAudio();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'triangle';
      o.frequency.value = 620 + Math.random()*160;
      g.gain.setValueAtTime(0.035, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.03);
    }catch(e){}
  }

  function playPaper(){
    try{
      const ctx = ensureAudio();
      const bufferSize = ctx.sampleRate * 0.25;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize) * 0.35;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1200;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      noise.connect(filter); filter.connect(g); g.connect(ctx.destination);
      noise.start();
    }catch(e){}
  }

  function playStamp(yabai){
    try{
      const ctx = ensureAudio();
      // low thud
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(yabai ? 130 : 180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.25);
      g.gain.setValueAtTime(0.5, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.3);

      // noise crack
      const bufferSize = ctx.sampleRate * 0.08;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const ng = ctx.createGain();
      ng.gain.value = 0.4;
      noise.connect(ng); ng.connect(ctx.destination);
      noise.start();
    }catch(e){}
  }

  function pickExcuse(){
    const pool = EXCUSES.items.filter(x => x.cat === currentCat);
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function typeText(text, cb){
    textboxEl.innerHTML = "";
    let i = 0;
    typing = true;
    genBtn.disabled = true;
    const caret = document.createElement('span');
    caret.className = 'caret';

    function step(){
      if (i < text.length){
        textboxEl.textContent = text.slice(0, i+1);
        textboxEl.appendChild(caret);
        if (i % 2 === 0) playType();
        i++;
        setTimeout(step, 34);
      } else {
        textboxEl.textContent = text;
        typing = false;
        genBtn.disabled = false;
        cb && cb();
      }
    }
    step();
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  genBtn.addEventListener('click', () => {
    if (typing) return;
    ensureAudio();
    playPaper();

    verdictEl.classList.remove('show');
    verdictEl.style.opacity = 0;

    const picked = pickExcuse();
    lastExcuseText = "「" + picked.text + "」";

    faceImgEl.src = picked.yabai ? FACE.angry : FACE.surprised;
    faceWrapEl.classList.remove('shake','pop');
    void faceWrapEl.offsetWidth;
    faceWrapEl.classList.add(picked.yabai ? 'shake' : 'pop');

    typeText(lastExcuseText, () => {
      const pool = picked.yabai ? VERDICT_YABAI : VERDICT_NORMAL;
      const verdict = pool[Math.floor(Math.random()*pool.length)];
      verdictEl.textContent = verdict;
      verdictEl.classList.add('show');
      playStamp(picked.yabai);

      count++;
      countEl.textContent = count;
      localStorage.setItem('ossan_iiwake_count', String(count));
    });
  });

  shareBtn.addEventListener('click', async () => {
    const shareText = lastExcuseText
      ? "おっさんの言い訳製造機で出てきた言い訳→ " + lastExcuseText
      : "おっさんの言い訳製造機、しょうもない言い訳が120本入っとるで";
    const url = location.href;
    if (navigator.share){
      try{
        await navigator.share({ title: '言い訳製造機', text: shareText, url });
      }catch(e){}
    } else {
      try{
        await navigator.clipboard.writeText(shareText + " " + url);
        showToast('コピーしたで📋');
      }catch(e){
        showToast('共有に対応してへんブラウザや…');
      }
    }
  });

  buildTabs();
</script>
