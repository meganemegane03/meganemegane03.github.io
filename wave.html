<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaru Azuki App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        .zaru { 
            position: relative; 
            width: 320px; 
            height: 180px; 
            background-image: url('wood-box.PNG'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }
        .azuki { 
            position: absolute; 
            width: 12px; 
            height: 12px; 
            background: #8b0000; 
            border-radius: 50%; 
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.6); 
        }
        .start-btn { margin-top: 20px; padding: 15px 30px; font-size: 1.2rem; background: #38bdf8; border: none; border-radius: 30px; cursor: pointer; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body>
    <p id="status">ボタンを押してスタート</p>
    <div class="zaru" id="zaruContainer"></div>
    <button class="start-btn" id="startButton">音と小豆を有効化</button>

    <script>
        let audio, isRunning = false;
        const container = document.getElementById('zaruContainer');
        const azukis = [];
        
        const width = 320;
        const height = 180;
        const radius = 6;
        
        const minX = 45;
        const maxX = width - 45;
        const minY = 65;
        const maxY = 117; 

        for (let i = 0; i < 30; i++) {
            const div = document.createElement('div');
            div.className = 'azuki';
            container.appendChild(div);
            azukis.push({ 
                el: div, 
                x: minX + Math.random() * (maxX - minX), 
                y: minY + Math.random() * (maxY - minY), 
                vx: 0, 
                vy: 0 
            });
        }

        let tiltX = 0, tiltY = 0;

        function update() {
            if (isRunning) {
                let totalSpeed = 0; // 全小豆の動きの合計を計算用

                // 1. 各小豆の移動と壁の判定
                azukis.forEach(a => {
                    a.vx += tiltX * 0.3; 
                    a.vy += tiltY * 0.3;
                    a.vx *= 0.88; 
                    a.vy *= 0.88;
                    a.x += a.vx; 
                    a.y += a.vy;

                    if (a.x < minX) { a.x = minX; a.vx *= -0.7; } 
                    else if (a.x > maxX) { a.x = maxX; a.vx *= -0.7; }
                    if (a.y < minY) { a.y = minY; a.vy *= -0.7; } 
                    else if (a.y > maxY) { a.y = maxY; a.vy *= -0.7; }

                    // 小豆ごとのスピード（絶対値）を足し合わせていく
                    totalSpeed += Math.abs(a.vx) + Math.abs(a.vy);
                });

                // 2. 小豆同士の衝突判定
                for (let i = 0; i < azukis.length; i++) {
                    for (let j = i + 1; j < azukis.length; j++) {
                        const a1 = azukis[i], a2 = azukis[j];
                        const dx = a2.x - a1.x, dy = a2.y - a1.y, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < radius * 2) {
                            const angle = Math.atan2(dy, dx);
                            const overlap = (radius * 2) - dist;
                            a1.x -= Math.cos(angle) * overlap * 0.5;
                            a1.y -= Math.sin(angle) * overlap * 0.5;
                            a2.x += Math.cos(angle) * overlap * 0.5;
                            a2.y += Math.sin(angle) * overlap * 0.5;
                            
                            const tempVx = a1.vx, tempVy = a1.vy;
                            a1.vx = a2.vx * 0.8; a1.vy = a2.vy * 0.8;
                            a2.vx = tempVx * 0.8; a2.vy = tempVy * 0.8;
                        }
                    }
                }

                // 3. 画面の位置に反映
                azukis.forEach(a => { 
                    a.el.style.left = (a.x - radius) + 'px'; 
                    a.el.style.top = (a.y - radius) + 'px'; 
                });

                // 4. ★小豆の動きの合計（totalSpeed）に応じて波音の音量をダイレクトに変更
                if (audio) {
                    // 動きがほぼゼロなら無音、少し動けば小さめ、大きく動けば大音量
                    let vol = totalSpeed / 40; 
                    if (vol > 1.0) vol = 1.0;
                    if (vol < 0.05) vol = 0.0; // 完全停止時はピタッと無音に
                    audio.volume = vol;
                }
            }
            requestAnimationFrame(update);
        }
        update();

        document.getElementById('startButton').addEventListener('click', () => {
            audio = new Audio('wave.mp3');
            audio.loop = true;
            audio.volume = 0.0;
            audio.play();

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                });
            } else {
                window.addEventListener('deviceorientation', e => {
                    handleOrientation(e);
                });
            }

            isRunning = true;
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('status').textContent = 'スマホを傾けると、小豆が転がって波音が鳴ります';
        });

        function handleOrientation(e) {
            // スマホの傾きをそのまま小豆への重力（力の方向）として伝える
            tiltX = (e.gamma || 0) / 10;
            tiltY = (e.beta || 0) / 10;
        }
    </script>
</body>
</html>
