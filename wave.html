<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaru Azuki Wave App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }
        /* ざるの枠組み */
        .zaru-wrapper {
            position: relative;
            width: 320px;
            height: 480px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            background-color: #1e293b;
            border: 4px solid #854d0e;
        }
        /* 背景としてのざる画像 */
        .zaru-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            opacity: 0.7;
        }
        /* ざるの中で動く小豆（30個生成されます） */
        .azuki {
            position: absolute;
            width: 28px;
            height: 28px;
            object-fit: contain;
            z-index: 2;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        .start-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div>
        <h1>ざる・小豆 波音アプリ</h1>
        <p id="status">ボタンを押してスタートしてください</p>
        
        <div class="zaru-wrapper" id="zaruContainer">
            <!-- 背景のざる画像（ファイル名が違う場合はここを修正してください） -->
            <img src="zaru.jpg" class="zaru-bg" alt="ざるの背景">
        </div>
        
        <button class="start-btn" id="startButton">音とセンサーを有効化</button>
    </div>

    <script>
        let audioCtx = null;
        let noiseNode = null;
        let filterNode = null;
        let isRunning = false;

        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const container = document.getElementById('zaruContainer');

        // 小豆のデータ（30個作成）
        const azukiCount = 30;
        const azukis = [];

        // 画面サイズ（ざるの内部）
        const maxX = 320;
        const maxY = 480;

        // 小豆を生成して配置する
        for (let i = 0; i < azukiCount; i++) {
            const img = document.createElement('img');
            img.src = 'zaru.jpg'; // 同じ画像を小豆のパーツとしても利用します
            img.className = 'azuki';
            container.appendChild(img);

            azukis.push({
                element: img,
                x: 60 + Math.random() * (maxX - 120),
                y: 100 + Math.random() * (maxY - 200),
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            });
        }

        // 物理アニメーション（小豆がコロコロ転がる動き）
        let tiltX = 0;
        let tiltY = 0;

        function updatePhysics() {
            if (isRunning) {
                // 傾きに応じて速度を変化させる
                for (let a of azukis) {
                    a.vx += tiltX * 0.15;
                    a.vy += tiltY * 0.15;

                    // 摩擦で少しずつスピードを落とす
                    a.vx *= 0.85;
                    a.vy *= 0.85;

                    a.x += a.vx;
                    a.y += a.vy;

                    // ざるの端っこ（壁）で跳ね返す
                    const margin = 20;
                    if (a.x < margin) { a.x = margin; a.vx *= -0.5; }
                    if (a.x > maxX - margin) { a.x = maxX - margin; a.vx *= -0.5; }
                    if (a.y < margin) { a.y = margin; a.vy *= -0.5; }
                    if (a.y > maxY - margin) { a.y = maxY - margin; a.vy *= -0.5; }

                    // 画面の位置に反映
                    a.element.style.left = a.x + 'px';
                    a.element.style.top = a.y + 'px';
                }
            }
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        // 波の音の準備
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(350, audioCtx.currentTime);

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        // スタートボタン
        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                initAudio();
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        statusText.textContent = 'スマホを傾けると小豆が転がります';
                        startButton.style.display = 'none';
                        isRunning = true;
                    } else {
                        alert('センサーの権限が許可されませんでした');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                statusText.textContent = 'スマホを傾けると小豆が転がります';
                startButton.style.display = 'none';
                isRunning = true;
            }
        });

        // 傾き検知
        function handleOrientation(event) {
            const beta = event.beta || 0;   // 前後 (-180 ～ 180)
            const gamma = event.gamma || 0; // 左右 (-90 ～ 90)

            // 傾きの強さを物理演算用の数値に変換
            tiltX = gamma / 15;
            tiltY = beta / 15;

            // 音のフィルター変更
            if (filterNode) {
                const freq = Math.min(Math.max(200 + Math.abs(gamma) * 25, 200), 1800);
                filterNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
            }
        }
    </script>
</body>
</html>
