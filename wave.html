<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaru Azuki App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a1a">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        p {
            font-size: 0.95rem;
            color: #dddddd;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .zaru {
            position: relative;
            width: 320px;
            height: 180px;
            background-color: #e5c598;
            border: 6px solid #8b4513;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            margin: 0 auto 20px auto;
        }
        .azuki {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #8b0000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
        }
        .start-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <p id="status">ボタンを押してスタートしてください</p>

    <div class="zaru" id="zaruContainer"></div>

    <button class="start-btn" id="startButton">音とセンサーを有効化</button>

    <script>
        let audioCtx = null;
        let noiseNode = null;
        let filterNode = null;
        let isRunning = false;

        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const container = document.getElementById('zaruContainer');

        const width = 320;
        const height = 180;
        const margin = 15;

        // 確実に30個生成する処理
        const azukiCount = 30;
        const azukis = [];

        for (let i = 0; i < azukiCount; i++) {
            const div = document.createElement('div');
            div.className = 'azuki';
            container.appendChild(div);

            azukis.push({
                element: div,
                x: margin + Math.random() * (width - margin * 2),
                y: margin + Math.random() * (height - margin * 2),
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2
            });
        }

        let tiltX = 0;
        let tiltY = 0;

        function updatePhysics() {
            if (isRunning) {
                for (let a of azukis) {
                    a.vx += tiltX * 0.25;
                    a.vy += tiltY * 0.25;

                    a.vx *= 0.8;
                    a.vy *= 0.8;

                    a.x += a.vx;
                    a.y += a.vy;

                    if (a.x < margin) { a.x = margin; a.vx *= -0.5; }
                    if (a.x > width - margin) { a.x = width - margin; a.vx *= -0.5; }
                    if (a.y < margin) { a.y = margin; a.vy *= -0.5; }
                    if (a.y > height - margin) { a.y = height - margin; a.vy *= -0.5; }

                    a.element.style.left = a.x + 'px';
                    a.element.style.top = a.y + 'px';
                }
            }
            requestAnimationFrame(updatePhysics);
        }
        updatePhysics();

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(350, audioCtx.currentTime);

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                initAudio();
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        statusText.textContent = 'スマホを左右に傾けると、小豆が転がって波の音がします。';
                        startButton.style.display = 'none';
                        isRunning = true;
                    } else {
                        alert('センサーの権限が許可されませんでした');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                statusText.textContent = 'スマホを左右に傾けると、小豆が転がって波の音がします。';
                startButton.style.display = 'none';
                isRunning = true;
            }
        });

        function handleOrientation(event) {
            const beta = event.beta || 0;
            const gamma = event.gamma || 0;

            tiltX = gamma / 10;
            tiltY = beta / 10;

            if (filterNode) {
                const freq = Math.min(Math.max(200 + Math.abs(gamma) * 25, 200), 1800);
                filterNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
            }
        }
    </script>
</body>
</html>
