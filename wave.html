<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小豆の波おもちゃ</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .box {
            width: 80vw;
            max-width: 300px;
            height: 150px;
            border: 4px solid #8B4513;
            background: #DEB887;
            border-radius: 10px;
            position: relative;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .bean {
            width: 12px;
            height: 12px;
            background: #800020; /* 小豆色 */
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
        }
        p {
            font-size: 14px;
            color: #aaa;
            padding: 0 20px;
        }
    </style>
</head>
<body>

    <button id="startButton">スタート（音を有効にする）</button>
    <p>スマホを左右に傾けると、小豆が転がって波の音がします。</p>
    
    <div class="box" id="box">
        <div class="bean" id="bean"></div>
    </div>

    <script>
        let audioCtx;
        let noiseNode;
        let filterNode;
        let gainNode;
        let isRunning = false;

        const startButton = document.getElementById('startButton');
        const bean = document.getElementById('bean');
        const box = document.getElementById('box');

        // 音の初期設定（ホワイトノイズを波っぽく加工）
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // ホワイトノイズのバッファ作成
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            // ローパスフィルターで「ざざー」というこもった音（波や小豆っぽさ）にする
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(400, audioCtx.currentTime);

            // 音量調整
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        // スタートボタン
        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                initAudio();
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            // iOSなどのセンサー許可をリクエスト
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        startSensor();
                    } else {
                        alert('センサーの許可が必要です');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                startSensor();
            }

            startButton.style.display = 'none';
            isRunning = true;
        });

        // 傾きセンサーの処理
        function startSensor() {
            window.addEventListener('deviceorientation', (event) => {
                if (!isRunning) return;

                // 左右の傾き (gamma: -90 ～ 90)
                let gamma = event.gamma || 0; 
                
                // 画面上の小豆の動きを計算（ざるの中で転がるイメージ）
                let moveX = gamma * 1.5;
                const maxMove = (box.clientWidth / 2) - 10;
                if (moveX > maxMove) moveX = maxMove;
                if (moveX < -maxMove) moveX = -maxMove;
                bean.style.transform = `translate(calc(-50% + ${moveX}px), -50%)`;

                // 傾きの「変化のスピードや傾き具合」に応じて音量とフィルターを変化させる
                let tiltRate = Math.abs(gamma) / 90; // 0 〜 1
                
                // 音量（傾けているほど大きく）
                gainNode.gain.setTargetAtTime(tiltRate * 0.8, audioCtx.currentTime, 0.1);
                
                // フィルター周波数（小豆が勢いよく動くイメージ）
                filterNode.frequency.setTargetAtTime(200 + tiltRate * 800, audioCtx.currentTime, 0.1);
            });
        }
    </script>
</body>
</html>
