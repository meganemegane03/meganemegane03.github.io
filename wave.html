<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小豆の波おもちゃ（画像版）</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            text-align: center;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            z-index: 10; /* ボタンを画像の上に表示 */
        }
        .box {
            width: 80vw;
            max-width: 320px; /* 画像の比率に合わせて少し調整 */
            height: 400px; /* 縦長の画像に合わせて高く設定 */
            
            /* --- 変更点: CSSの設定を画像ベースに変更 --- */
            background-image: url('azuki_box.png'); /* 保存した画像ファイル名を指定 */
            background-size: contain; /* 画像全体が枠に収まるように表示 */
            background-position: center;
            background-repeat: no-repeat;
            
            /* 枠線と背景色は不要になったので削除かコメントアウト */
            /* border: 4px solid #8B4513; */
            /* background: #DEB887; */
            
            border-radius: 10px;
            position: relative;
            /* box-shadow: inset 0 10px 20px rgba(0,0,0,0.3); */ /* 画像に立体感があるので削除 */
            margin-top: 20px;
            overflow: hidden; /* 豆が画像の外に出ないようにする */
        }
        .bean {
            width: 12px;
            height: 12px;
            background: #800020; /* 小豆色 */
            border-radius: 50%;
            position: absolute;
            top: 50%; /* 画像の中心あたりに配置 */
            left: 50%;
            transform: translate(-50%, -50%);
            transition: transform 0.1s linear; /* 少し滑らかに */
            opacity: 0.7; /* 写真になじませるために少し透過 */
        }
        p {
            font-size: 14px;
            color: #aaa;
            padding: 0 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="startButton">スタート（音を有効にする）</button>
    <p>スマホを左右に傾けると、小豆が転がって波の音がします。</p>
    
    <div class="box" id="box">
        <!-- この赤い点は、画像の上で転がる小豆の「代表」です -->
        <div class="bean" id="bean"></div>
    </div>

    <script>
        let audioCtx;
        let noiseNode;
        let filterNode;
        let gainNode;
        let isRunning = false;

        const startButton = document.getElementById('startButton');
        const bean = document.getElementById('bean');
        const box = document.getElementById('box');

        // 音の初期設定（前回と同じ）
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;
            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(400, audioCtx.currentTime);
            gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noiseNode.start();
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) initAudio();
            else if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') startSensor();
                    else alert('センサーの許可が必要です');
                } catch (e) { console.error(e); }
            } else { startSensor(); }
            startButton.style.display = 'none';
            isRunning = true;
        });

        function startSensor() {
            window.addEventListener('deviceorientation', (event) => {
                if (!isRunning) return;
                let gamma = event.gamma || 0; 
                
                // --- 変更点: 画像の範囲内で豆が動くように計算を調整 ---
                // 傾きに応じて移動量を計算 (画像の中心を基準に)
                let moveX = gamma * 2; // 感度を少し調整
                
                // 豆が画像の左右端から出ないように制限 (画像の幅を考慮)
                const boxWidth = box.clientWidth;
                const maxMove = (boxWidth / 2) - 20; // 余裕を持たせる
                if (moveX > maxMove) moveX = maxMove;
                if (moveX < -maxMove) moveX = -maxMove;
                
                // 豆の位置を更新 (画像の中央 + 移動量)
                bean.style.transform = `translate(calc(-50% + ${moveX}px), -50%)`;

                let tiltRate = Math.abs(gamma) / 90; 
                gainNode.gain.setTargetAtTime(tiltRate * 0.8, audioCtx.currentTime, 0.1);
                filterNode.frequency.setTargetAtTime(200 + tiltRate * 800, audioCtx.currentTime, 0.1);
            });
        }
    </script>
</body>
</html>
