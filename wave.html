<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaru Azuki Wave App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }
        .container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ざるの画像を表示する部分 */
        .zaru-wrapper {
            width: 320px;
            height: 480px;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.05s ease-out;
            transform-origin: center center;
        }
        .start-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container-all">
        <h1>ざる・小豆 波音アプリ</h1>
        <p id="status">ボタンを押してスタートしてください</p>
        
        <div class="container">
            <div class="zaru-wrapper">
                <!-- 画像ファイル名（zaru.jpg）を指定しています -->
                <img id="zaruImg" src="zaru.jpg" alt="ざると小豆の画像">
            </div>
        </div>
        
        <button class="start-btn" id="startButton">音とセンサーを有効化</button>
    </div>

    <script>
        let audioCtx = null;
        let noiseNode = null;
        let filterNode = null;
        let isRunning = false;

        const startButton = document.getElementById('startButton');
        const statusText = document.getElementById('status');
        const zaruImg = document.getElementById('zaruImg');

        // 波の音（ホワイトノイズ＋ローパスフィルター）の準備
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }

            noiseNode = audioCtx.createBufferSource();
            noiseNode.buffer = buffer;
            noiseNode.loop = true;

            filterNode = audioCtx.createBiquadFilter();
            filterNode.type = 'lowpass';
            filterNode.frequency.setValueAtTime(350, audioCtx.currentTime);

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);

            noiseNode.connect(filterNode);
            filterNode.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            noiseNode.start();
        }

        // スタートボタン（ブラウザの自動再生制限を解除するため必須）
        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                initAudio();
            } else if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            // iPhoneの傾きセンサー（ジャイロ）の許可リクエスト
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        statusText.textContent = 'スマホを傾けると画像と音が連動します';
                        startButton.style.display = 'none';
                        isRunning = true;
                    } else {
                        alert('センサーの権限が許可されませんでした');
                    }
                } catch (e) {
                    console.error(e);
                }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                statusText.textContent = 'スマホを傾けると画像と音が連動します';
                startButton.style.display = 'none';
                isRunning = true;
            }
        });

        // スマホを傾けたときの処理
        function handleOrientation(event) {
            if (!isRunning) return;

            const beta = event.beta || 0;   // 前後の傾き (-180 ～ 180)
            const gamma = event.gamma || 0; // 左右の傾き (-90 ～ 90)

            // 傾きに合わせて画像を少し傾けたり移動させ、ざるを揺らしているように見せる
            const moveX = gamma * 0.8;
            const moveY = (beta - 45) * 0.8; // 持っている自然な角度を基準に調整
            const rotateDeg = gamma * 0.3;

            zaruImg.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotateDeg}deg)`;

            // 傾きに応じて波の音の響き（フィルター）を変化させる
            if (filterNode) {
                const freq = Math.min(Math.max(200 + Math.abs(gamma) * 25, 200), 1800);
                filterNode.frequency.setValueAtTime(freq, audioCtx.currentTime);
            }
        }
    </script>
</body>
</html>
