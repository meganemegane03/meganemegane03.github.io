<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaru Azuki App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        .zaru { 
            position: relative; 
            width: 320px; 
            height: 180px; 
            background-image: url('wood-box.PNG'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }
        .azuki { 
            position: absolute; 
            width: 12px; 
            height: 12px; 
            background: #8b0000; 
            border-radius: 50%; 
            box-shadow: inset -1px -1px 2px rgba(0,0,0,0.6); 
        }
        .start-btn { margin-top: 20px; padding: 15px 30px; font-size: 1.2rem; background: #38bdf8; border: none; border-radius: 30px; cursor: pointer; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body>
    <p id="status">ボタンを押してスタート</p>
    <div class="zaru" id="zaruContainer"></div>
    <button class="start-btn" id="startButton">音と小豆を有効化</button>

    <script>
        let audioCtx, gainNode, audioSource, audioBuffer;
        let isRunning = false;
        const container = document.getElementById('zaruContainer');
        const azukis = [];
        const width = 320;
        const height = 180;
        const radius = 6;
        const minX = 45, maxX = 275, minY = 65, maxY = 117; 

        // 小豆の初期化
        for (let i = 0; i < 30; i++) {
            const div = document.createElement('div');
            div.className = 'azuki';
            container.appendChild(div);
            azukis.push({ el: div, x: minX + Math.random()*(maxX-minX), y: minY + Math.random()*(maxY-minY), vx: 0, vy: 0 });
        }

        let tiltX = 0, tiltY = 0, baseGamma = null, baseBeta = null;

        function update() {
            if (isRunning) {
                let totalSpeed = 0;
                azukis.forEach(a => {
                    // 傾きを加速に変換（少し強めに）
                    a.vx += tiltX * 0.8; 
                    a.vy += tiltY * 0.8;
                    a.vx *= 0.92; a.vy *= 0.92; // 摩擦
                    a.x += a.vx; a.y += a.vy;

                    // 壁判定
                    if (a.x < minX) { a.x = minX; a.vx *= -0.5; } else if (a.x > maxX) { a.x = maxX; a.vx *= -0.5; }
                    if (a.y < minY) { a.y = minY; a.vy *= -0.5; } else if (a.y > maxY) { a.y = maxY; a.vy *= -0.5; }

                    totalSpeed += Math.sqrt(a.vx*a.vx + a.vy*a.vy);
                    a.el.style.left = (a.x - radius) + 'px';
                    a.el.style.top = (a.y - radius) + 'px';
                });

                // ボリューム更新
                if (gainNode) {
                    // スピードに合わせて滑らかに変化
                    let vol = Math.min(totalSpeed / 15, 1.0);
                    gainNode.gain.setTargetAtTime(vol < 0.05 ? 0 : vol, audioCtx.currentTime, 0.1);
                }
            }
            requestAnimationFrame(update);
        }
        update();

        async function initAudio() {
            const response = await fetch('wave.mp3');
            const data = await response.arrayBuffer();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(data);
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.loop = true;
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0;
            audioSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            audioSource.start(0);
        }

        document.getElementById('startButton').addEventListener('click', async () => {
            if (!audioCtx) await initAudio();
            else audioCtx.resume();

            const handle = (e) => {
                if (baseGamma === null) { baseGamma = e.gamma || 0; baseBeta = e.beta || 0; }
                tiltX = (e.gamma - baseGamma) / 10;
                tiltY = (e.beta - baseBeta) / 10;
            };

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                const res = await DeviceOrientationEvent.requestPermission();
                if (res === 'granted') window.addEventListener('deviceorientation', handle);
            } else {
                window.addEventListener('deviceorientation', handle);
            }
            isRunning = true;
            document.getElementById('startButton').style.display = 'none';
        });
    </script>
</body>
</html>
