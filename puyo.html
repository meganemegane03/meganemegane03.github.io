<!DOCTYPE html
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ぷよぷよ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a1a2e;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px;
  min-height: 100vh;
  font-family: sans-serif;
  color: white;
}
h1 {
  font-size: 1.5rem;
  margin-bottom: 6px;
  color: #f9ca24;
  letter-spacing: 4px;
}
#info {
  display: flex;
  gap: 20px;
  margin-bottom: 8px;
  font-size: 0.9rem;
}
.label { color: #aaa; font-size: 0.7rem; text-align:center; }
.value { font-size: 1.1rem; font-weight: bold; color: #f9ca24; text-align:center; }
#game-wrap {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
canvas {
  border: 2px solid #444;
  border-radius: 6px;
  background: #0d0d1a;
  display: block;
}
#side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#next-label { font-size: 0.7rem; color: #aaa; }
#controls {
  display: grid;
  grid-template-columns: repeat(3, 48px);
  grid-template-rows: repeat(2, 48px);
  gap: 5px;
}
.btn {
  background: #2d2d44;
  border: 2px solid #555;
  border-radius: 8px;
  color: white;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { background: #555; }
#btn-left  { grid-column:1; grid-row:2; }
#btn-down  { grid-column:2; grid-row:2; }
#btn-right { grid-column:3; grid-row:2; }
#btn-rot   { grid-column:2; grid-row:1; font-size:0.7rem; }
#msg {
  margin-top: 8px;
  font-size: 0.9rem;
  color: #f9ca24;
  min-height: 1.4em;
  text-align: center;
}
#start-btn {
  margin-top: 6px;
  padding: 10px 28px;
  background: #f9ca24;
  color: #1a1a2e;
  border: none;
  border-radius: 20px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>ぷよぷよ</h1>
<div id="info">
  <div><div class="label">スコア</div><div class="value" id="score">0</div></div>
  <div><div class="label">レベル</div><div class="value" id="level">1</div></div>
  <div><div class="label">連鎖</div><div class="value" id="chain">0</div></div>
</div>
<div id="game-wrap">
  <canvas id="canvas" width="180" height="360"></canvas>
  <div id="side">
    <div id="next-label">NEXT</div>
    <canvas id="next-canvas" width="72" height="72"></canvas>
    <div id="controls">
      <div class="btn" id="btn-rot">回転</div>
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
  </div>
</div>
<div id="msg">スタートを押してね！</div>
<button id="start-btn">スタート</button>

<script>
var COLS=6, ROWS=12, CELL=30;
var COLORS=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'];
var canvas=document.getElementById('canvas');
var ctx=canvas.getContext('2d');
var nc=document.getElementById('next-canvas');
var nCtx=nc.getContext('2d');
var board,current,next,score,gameOver,timer;

function rc(){ return Math.floor(Math.random()*COLORS.length); }

function newPair(){ return {x:2,y:0,c1:rc(),c2:rc(),rot:0}; }

function offsets(rot){
  var o=[[0,-1],[1,0],[0,1],[-1,0]];
  return o[rot];
}

function positions(p){
  var o=offsets(p.rot);
  return [{x:p.x,y:p.y},{x:p.x+o[0],y:p.y+o[1]}];
}

function valid(p){
  var ps=positions(p);
  for(var i=0;i<ps.length;i++){
    var q=ps[i];
    if(q.x<0||q.x>=COLS||q.y>=ROWS) return false;
    if(q.y>=0 && board[q.y][q.x]!==null) return false;
  }
  return true;
}

function place(p){
  var ps=positions(p);
  for(var i=0;i<ps.length;i++){
    var q=ps[i];
    if(q.y>=0&&q.y<ROWS) board[q.y][q.x]=(i===0?p.c1:p.c2);
  }
}

function gravity(){
  var moved=true;
  while(moved){
    moved=false;
    for(var y=ROWS-2;y>=0;y--){
      for(var x=0;x<COLS;x++){
        if(board[y][x]!==null&&board[y+1][x]===null){
          board[y+1][x]=board[y][x];board[y][x]=null;moved=true;
        }
      }
    }
  }
}

function flood(x,y,c,vis){
  if(x<0||x>=COLS||y<0||y>=ROWS) return [];
  if(vis[y][x]||board[y][x]!==c) return [];
  vis[y][x]=true;
  var g=[{x:x,y:y}];
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var i=0;i<dirs.length;i++) g=g.concat(flood(x+dirs[i][0],y+dirs[i][1],c,vis));
  return g;
}

function clearGroups(){
  var vis=[];
  for(var i=0;i<ROWS;i++) vis.push(new Array(COLS).fill(false));
  var cleared=false;
  for(var y=0;y<ROWS;y++){
    for(var x=0;x<COLS;x++){
      if(board[y][x]!==null&&!vis[y][x]){
        var g=flood(x,y,board[y][x],vis);
        if(g.length>=4){
          for(var i=0;i<g.length;i++) board[g[i].y][g[i].x]=null;
          cleared=true;
        }
      }
    }
  }
  return cleared;
}

function drawPuyo(c,x,y,ct){
  var px=x*CELL+2,py=y*CELL+2,s=CELL-4;
  ct.fillStyle=COLORS[c];
  ct.beginPath();ct.arc(px+s/2,py+s/2,s/2,0,Math.PI*2);ct.fill();
  ct.fillStyle='rgba(255,255,255,0.3)';
  ct.beginPath();ct.arc(px+s/2-s*0.15,py+s/2-s*0.15,s*0.2,0,Math.PI*2);ct.fill();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(var y=0;y<ROWS;y++)
    for(var x=0;x<COLS;x++)
      if(board[y][x]!==null) drawPuyo(board[y][x],x,y,ctx);
  if(current&&!gameOver){
    var ps=positions(current);
    drawPuyo(current.c1,ps[0].x,ps[0].y,ctx);
    if(ps[1].y>=0) drawPuyo(current.c2,ps[1].x,ps[1].y,ctx);
  }
  nCtx.clearRect(0,0,72,72);
  if(next){
    nCtx.fillStyle=COLORS[next.c1];
    nCtx.beginPath();nCtx.arc(36,50,13,0,Math.PI*2);nCtx.fill();
    nCtx.fillStyle=COLORS[next.c2];
    nCtx.beginPath();nCtx.arc(36,20,13,0,Math.PI*2);nCtx.fill();
  }
}

function resolve(chain){
  gravity();
  if(clearGroups()){
    score+=chain*chain*100;
    document.getElementById('score').textContent=score;
    document.getElementById('chain').textContent=chain;
    draw();
    setTimeout(function(){ resolve(chain+1); },500);
  } else {
    document.getElementById('chain').textContent=0;
    current=next;next=newPair();
    if(!valid(current)){
      gameOver=true;
      document.getElementById('msg').textContent='ゲームオーバー😇';
      document.getElementById('start-btn').textContent='もう一回';
      document.getElementById('start-btn').style.display='block';
      clearInterval(timer);
    }
    draw();
  }
}

function step(){
  if(gameOver) return;
  var m={x:current.x,y:current.y+1,c1:current.c1,c2:current.c2,rot:current.rot};
  if(valid(m)){
    current=m;
  } else {
    place(current);
    clearInterval(timer);
    setTimeout(function(){ resolve(1); timer=setInterval(step,600); },300);
  }
  draw();
}

function move(dx){
  if(gameOver) return;
  var m={x:current.x+dx,y:current.y,c1:current.c1,c2:current.c2,rot:current.rot};
  if(valid(m)){current=m;draw();}
}

function rotate(){
  if(gameOver) return;
  var m={x:current.x,y:current.y,c1:current.c1,c2:current.c2,rot:(current.rot+1)%4};
  if(valid(m)){current=m;draw();}
}

function drop(){
  if(gameOver) return;
  var m={x:current.x,y:current.y+1,c1:current.c1,c2:current.c2,rot:current.rot};
  if(valid(m)){current=m;draw();}
}

function startGame(){
  board=[];
  for(var i=0;i<ROWS;i++) board.push(new Array(COLS).fill(null));
  score=0;gameOver=false;
  document.getElementById('score').textContent=0;
  document.getElementById('chain').textContent=0;
  document.getElementById('msg').textContent='';
  document.getElementById('start-btn').style.display='none';
  current=newPair();next=newPair();
  clearInterval(timer);
  timer=setInterval(step,600);
  draw();
}

document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('btn-left').addEventListener('click',function(){move(-1);});
document.getElementById('btn-right').addEventListener('click',function(){move(1);});
document.getElementById('btn-down').addEventListener('click',drop);
document.getElementById('btn-rot').addEventListener('click',rotate);
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') move(-1);
  if(e.key==='ArrowRight') move(1);
  if(e.key==='ArrowDown') drop();
  if(e.key==='ArrowUp'||e.key===' ') rotate();
});

draw();
</script>
</body>
</html>
