

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#557c5b">

<title>noteサポ</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  padding: 18px 14px 40px;

  background: #f5f6f1;

  color: #333;

  font-family: -apple-system, BlinkMacSystemFont,

    "Helvetica Neue", sans-serif;

}

main {

  max-width: 560px;

  margin: auto;

}

header {

  text-align: center;

  padding: 18px 0 22px;

}

.logo {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  width: 64px;

  height: 64px;

  border-radius: 20px;

  background: #557c5b;

  color: white;

  font-size: 31px;

  font-weight: bold;

  margin-bottom: 10px;

}

h1 {

  margin: 0;

  color: #557c5b;

  font-size: 31px;

}

header p {

  color: #777;

  font-size: 13px;

  margin: 8px 0 0;

}

.card {

  background: white;

  border-radius: 17px;

  padding: 18px;

  margin-bottom: 15px;

  box-shadow: 0 2px 8px #00000008;

}

h2 {

  font-size: 17px;

  margin: 0 0 13px;

}

.small {

  font-size: 12px;

  color: #888;

  line-height: 1.7;

}

label {

  display: block;

  font-size: 13px;

  color: #666;

  margin: 12px 0 7px;

}

input, textarea, select {

  width: 100%;

  padding: 12px;

  border: 1px solid #dedede;

  border-radius: 10px;

  background: #fff;

  font-size: 16px;

  font-family: inherit;

  color: #333;

}

textarea {

  resize: vertical;

  min-height: 170px;

  line-height: 1.7;

}

#article {

  min-height: 230px;

}

button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 12px;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;

  font-family: inherit;

}

.menu {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

}

.menu button {

  background: #e8f0e6;

  color: #426a48;

  min-height: 82px;

  line-height: 1.5;

}

.menu button:last-child {

  grid-column: 1 / 3;

  background: #557c5b;

  color: white;

}

.primary {

  background: #557c5b;

  color: white;

  margin-top: 12px;

}

.secondary {

  background: #eeeeea;

  color: #555;

  margin-top: 10px;

}

.result {

  min-height: 220px;

  background: #fafbf8;

}

#copyStatus {

  text-align: center;

  font-size: 13px;

  color: #557c5b;

  min-height: 20px;

  margin-top: 8px;

}

.footer {

  text-align: center;

  color: #888;

  font-size: 11px;

  line-height: 1.8;

  margin-top: 22px;

}

details summary {

  cursor: pointer;

  font-size: 14px;

  font-weight: bold;

  color: #557c5b;

}

details[open] summary {

  margin-bottom: 12px;

}

</style>

</head>

<body>

<main>

<header>

  <div class="logo">n</div>

  <h1>noteサポ</h1>

  <p>記事の投稿準備をお手伝い</p>

</header>

<div class="card">

  <h2>① 記事を貼り付ける</h2>

  <p class="small">

    noteに投稿する記事をコピーして、ここに貼り付けてください。

  </p>

  <label for="article">記事本文</label>

  <textarea id="article"

    placeholder="ここに記事本文を貼り付けてください"></textarea>

  <label for="title">現在のタイトル（任意）</label>

  <input id="title"

    placeholder="まだ決まっていなくてもOK">

  <label for="tone">記事の雰囲気</label>

  <select id="tone">

    <option>おまかせ</option>

    <option>親しみやすい</option>

    <option>ユーモラス</option>

    <option>感動的</option>

    <option>知的で落ち着いた</option>

    <option>読者の共感を重視</option>

    <option>素直で自然体</option>

  </select>

</div>

<div class="card">

  <h2>② やりたいことを選ぶ</h2>

  <div class="menu">

    <button onclick="makePrompt('title')">

      ✏️<br>タイトル案

    </button>

    <button onclick="makePrompt('tag')">

      #️⃣<br>ハッシュタグ

    </button>

    <button onclick="makePrompt('image')">

      🖼️<br>見出し画像

    </button>

    <button onclick="makePrompt('all')">

      📋<br>投稿準備まとめ

    </button>

  </div>

</div>

<div class="card">

  <h2>③ 自分の世界観を登録（任意）</h2>

  <p class="small">

    いつも使っているキャラクターや画像の雰囲気を登録できます。

    毎回同じ説明をする手間を減らせます。

  </p>

  <label for="world">noteの世界観・発信テーマ</label>

  <textarea id="world"

    style="min-height:85px"

    placeholder="例：日常の出来事、AIとの会話、ユーモアのあるエッセイ"></textarea>

  <label for="character">キャラクター・画像の特徴</label>

  <textarea id="character"

    style="min-height:85px"

    placeholder="例：いつも同じキャラクターを使う。顔や髪型を変えない。"></textarea>

  <label for="imageStyle">画像の好み</label>

  <select id="imageStyle">

    <option>おまかせ</option>

    <option>イラスト風</option>

    <option>アニメ風</option>

    <option>写真風</option>

    <option>レトロポップ</option>

    <option>シンプルな図解</option>

    <option>絵本風</option>

  </select>

  <button class="secondary" onclick="saveSettings()">

    世界観を保存する

  </button>

  <p id="saveStatus" class="small"></p>

</div>

<div class="card">

  <h2>④ AIに渡す指示文</h2>

  <p class="small">

    上のボタンを押すと指示文が作られます。

    コピーしてChatGPTやClaudeに貼り付けてください。

  </p>

  <textarea id="result" class="result"

    placeholder="ここにAIへの指示文が表示されます"

    readonly></textarea>

  <button class="primary" onclick="copyPrompt()">

    指示文をコピーする

  </button>

  <p id="copyStatus"></p>

  <button class="secondary" onclick="clearAll()">

    入力内容を消して最初から

  </button>

</div>

<div class="footer">

  noteサポ<br>

  noteの記事を書く人を応援する無料アプリ<br>

  AIの回答はChatGPTやClaudeなどのサービスを利用します。

</div>

</main>

<script>

const $ = id => document.getElementById(id);

function saveSettings() {

  try {

    localStorage.setItem("noteSapoWorld", $("world").value);

    localStorage.setItem("noteSapoCharacter", $("character").value);

    localStorage.setItem("noteSapoImageStyle", $("imageStyle").value);

    $("saveStatus").textContent =

      "世界観をこの端末に保存しました！";

  } catch (e) {

    $("saveStatus").textContent =

      "保存できませんでした。";

  }

}

function loadSettings() {

  try {

    $("world").value =

      localStorage.getItem("noteSapoWorld") || "";

    $("character").value =

      localStorage.getItem("noteSapoCharacter") || "";

    $("imageStyle").value =

      localStorage.getItem("noteSapoImageStyle") || "おまかせ";

  } catch (e) {

    // 保存機能が使えない場合もアプリは利用可能

  }

}

function makePrompt(mode) {

  const article = $("article").value.trim();

  const title = $("title").value.trim();

  const tone = $("tone").value;

  const world = $("world").value.trim();

  const character = $("character").value.trim();

  const imageStyle = $("imageStyle").value;

  if (!article) {

    alert("先に記事本文を貼り付けてください。");

    return;

  }

  let task = "";

  if (mode === "title") {

    task = `

【タイトル案】

この記事の内容を読み取り、

記事の魅力が伝わるタイトルを10個提案してください。

・記事の内容から外れない

・本文の書き手らしさを大切にする

・大げさな煽りや釣りタイトルにしない

・切り口の異なるタイトルを提案する

・共感型、興味を引く型、ユーモア型などを含める

・それぞれのタイトルの特徴を簡単に説明する

・最後におすすめを3つ選ぶ

`;

  }

  if (mode === "tag") {

    task = `

【ハッシュタグ】

この記事の主題と読者の関心を読み取り、

記事に合うハッシュタグを提案してください。

・記事の中心テーマを重視する

・広いテーマと具体的なテーマを組み合わせる

・記事の内容に関連するタグだけを選ぶ

・無関係な人気タグを混ぜない

・おすすめを5〜10個提案する

・各タグを選んだ理由も簡単に説明する

・最後にコピーしやすい形でまとめる

`;

  }

  if (mode === "image") {

    task = `

【見出し画像】

この記事の内容や雰囲気に合うnoteの見出し画像を考えてください。

・記事の中心テーマを読み取る

・記事の世界観に合った画像を提案する

・構図、背景、色、人物や物の配置を説明する

・画像案を3種類提案する

・それぞれの画像が記事に合う理由を説明する

・おすすめの案を1つ選ぶ

・画像生成AIにそのまま渡せる完成プロンプトを作る

画像の好み：

${imageStyle}

キャラクターの指定：

${character || "特に指定なし"}

世界観：

${world || "記事の内容に合う自然な世界観"}

`;

  }

  if (mode === "all") {

    task = `

【投稿準備まとめ】

記事を書いた本人の個性を大切にしながら、

投稿準備をまとめて手伝ってください。

1. 記事のテーマと伝えたいこと

2. 記事の魅力と読者に与える印象

3. タイトル候補を5個

4. おすすめのタイトルを1つ

5. ハッシュタグ候補を5〜10個

6. タグを選んだ理由

7. 見出し画像のアイデアを3種類

8. おすすめの画像案と生成用プロンプト

9. 投稿前の簡単なアドバイス

タイトルやタグは、記事の内容に合ったものにしてください。

記事そのものを書き直す必要はありません。

元の記事の書き手らしさを尊重してください。

世界観：

${world || "特に指定なし"}

キャラクター：

${character || "特に指定なし"}

画像の好み：

${imageStyle}

`;

  }

  const prompt = `

あなたはnoteの投稿準備をサポートするアシスタントです。

【重要な方針】

・記事の内容を正確に読み取る

・書き手本人の個性や表現を尊重する

・記事に書かれていない事実を作らない

・大げさな煽りや誇張を避ける

・分かりやすく、実際に使える提案をする

・日本語で自然に回答する

【記事の雰囲気】

${tone}

【現在のタイトル】

${title || "未定"}

【依頼内容】

${task}

【記事本文】

${article}

以上をもとに回答してください。

`;

  $("result").value = prompt.trim();

  $("copyStatus").textContent = "";

  $("result").scrollIntoView({

    behavior: "smooth",

    block: "center"

  });

}

async function copyPrompt() {

  const result = $("result");

  if (!result.value.trim()) {

    alert("先に指示文を作成してください。");

    return;

  }

  try {

    await navigator.clipboard.writeText(result.value);

    $("copyStatus").textContent =

      "コピーできたで！AIに貼り付けて使ってください。";

  } catch (e) {

    result.focus();

    result.select();

    const success = document.execCommand("copy");

    if (success) {

      $("copyStatus").textContent =

        "コピーできたで！AIに貼り付けて使ってください。";

    } else {

      $("copyStatus").textContent =

        "指示文を長押ししてコピーしてください。";

    }

  }

}

function clearAll() {

  if (!confirm("記事本文とタイトル、指示文を消しますか？")) {

    return;

  }

  $("article").value = "";

  $("title").value = "";

  $("tone").selectedIndex = 0;

  $("result").value = "";

  $("copyStatus").textContent = "";

}

loadSettings();

</script>

</body>

</html>
