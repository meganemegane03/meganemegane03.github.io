<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ライスフランを落とすな</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(160deg, #fff0f5, #ffe4ec);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Hiragino Kaku Gothic ProN', sans-serif;
  color: #333;
  overflow: hidden;
  touch-action: none;
}
h1 {
  font-size: 1.4rem;
  color: #e75480;
  letter-spacing: 1px;
  margin-bottom: 2px;
  text-shadow: 0 2px 8px #e7548044;
}
#shop-name {
  font-size: 0.75rem;
  color: #c06080;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
#info {
  display: flex;
  gap: 20px;
  margin-bottom: 8px;
}
.label { color: #c06080; font-size: 0.7rem; text-align:center; }
.value { font-size: 1.1rem; font-weight: bold; color: #e75480; text-align:center; }
#game-area {
  position: relative;
  width: 320px;
  height: 400px;
  background: #fff8fa;
  border: 3px solid #f4a0b8;
  border-radius: 16px;
  overflow: hidden;
}
#player {
  position: absolute;
  bottom: 8px;
  left: 130px;
  width: 60px;
  height: 60px;
  font-size: 44px;
  text-align: center;
  line-height: 1;
  user-select: none;
}
.item {
  position: absolute;
  font-size: 30px;
  user-select: none;
  text-align: center;
  width: 36px;
}
#msg {
  margin-top: 8px;
  font-size: 1rem;
  color: #e75480;
  min-height: 1.4em;
  text-align: center;
  font-weight: bold;
}
#start-btn {
  margin-top: 8px;
  padding: 10px 28px;
  background: #e75480;
  color: white;
  border: none;
  border-radius: 20px;
  font-size: 1rem;
  font-weight: bold;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 4px 12px #e7548044;
}
#controls {
  display: flex;
  gap: 20px;
  margin-top: 10px;
}
.ctrl-btn {
  width: 64px;
  height: 52px;
  background: #f4a0b8;
  border: 2px solid #e75480;
  border-radius: 10px;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn:active { background: #e75480; }
#legend {
  margin-top: 6px;
  font-size: 0.72rem;
  color: #c06080;
  text-align: center;
}
</style>
</head>
<body>
<h1>🍮 ライスフランを落とすな！</h1>
<div id="shop-name">リカのTAMATEBAKO</div>
<div id="info">
  <div><div class="label">スコア</div><div class="value" id="score">0</div></div>
  <div><div class="label">ライフ</div><div class="value" id="life">❤️❤️❤️</div></div>
  <div><div class="label">レベル</div><div class="value" id="level">1</div></div>
</div>
<div id="game-area">
  <div id="player">👩</div>
</div>
<div id="msg">スタートを押してね！</div>
<button id="start-btn">スタート</button>
<div id="controls">
  <div class="ctrl-btn" id="btn-left">◀</div>
  <div class="ctrl-btn" id="btn-right">▶</div>
</div>
<div id="legend">🍮 ライスフランをキャッチ！　💩 は避けろ！</div>

<script>
var gameArea = document.getElementById('game-area');
var player = document.getElementById('player');
var scoreEl = document.getElementById('score');
var lifeEl = document.getElementById('life');
var levelEl = document.getElementById('level');
var msgEl = document.getElementById('msg');
var startBtn = document.getElementById('start-btn');

var AREA_W=320, AREA_H=400;
var PLAYER_W=60, PLAYER_H=60;
var playerX=130;
var score=0, life=3, level=1;
var items=[];
var gameOver=false;
var moving=0;
var spawnTimer, moveTimer, levelTimer;
var speed=2.5;

function lifeStr(n){
  var s='';
  for(var i=0;i<n;i++) s+='❤️';
  for(var i=n;i<3;i++) s+='🖤';
  return s;
}

function spawnItem(){
  var isPoo = Math.random() < 0.3;
  var el = document.createElement('div');
  el.className = 'item';
  el.textContent = isPoo ? '💩' : '🍮';
  var x = Math.floor(Math.random()*(AREA_W-40));
  el.style.left = x+'px';
  el.style.top = '-40px';
  gameArea.appendChild(el);
  items.push({el:el, x:x, y:-40, isPoo:isPoo});
}

function updateItems(){
  if(gameOver) return;
  for(var i=items.length-1;i>=0;i--){
    var item=items[i];
    item.y+=speed;
    item.el.style.top=item.y+'px';

    var py=AREA_H-PLAYER_H-8;
    if(item.y+36>=py && item.y<=py+PLAYER_H &&
       item.x+36>=playerX && item.x<=playerX+PLAYER_W){
      if(item.isPoo){
        life--;
        lifeEl.textContent=lifeStr(life);
        if(life<=0){
          item.el.remove(); items.splice(i,1);
          endGame(); return;
        }
      } else {
        score+=10;
        scoreEl.textContent=score;
      }
      item.el.remove(); items.splice(i,1);
    } else if(item.y>AREA_H){
      if(!item.isPoo){
        // ライスフランを落とした！
        life--;
        lifeEl.textContent=lifeStr(life);
        if(life<=0){
          item.el.remove(); items.splice(i,1);
          endGame(); return;
        }
      }
      item.el.remove(); items.splice(i,1);
    }
  }

  if(moving!==0){
    playerX+=moving*5;
    if(playerX<0) playerX=0;
    if(playerX>AREA_W-PLAYER_W) playerX=AREA_W-PLAYER_W;
    player.style.left=playerX+'px';
  }
}

function endGame(){
  gameOver=true;
  clearInterval(spawnTimer);
  clearInterval(moveTimer);
  clearInterval(levelTimer);
  msgEl.textContent='あぁ、もうムリ〜😭 スコア: '+score;
  startBtn.textContent='もう一回';
  startBtn.style.display='block';
}

function startGame(){
  for(var i=0;i<items.length;i++) items[i].el.remove();
  items=[]; score=0; life=3; level=1; speed=2.5; gameOver=false;
  playerX=130; player.style.left=playerX+'px';
  scoreEl.textContent=0;
  lifeEl.textContent=lifeStr(3);
  levelEl.textContent=1;
  msgEl.textContent='ライスフランを受け止めろ！🍮';
  startBtn.style.display='none';

  clearInterval(spawnTimer);
  clearInterval(moveTimer);
  clearInterval(levelTimer);

  spawnTimer=setInterval(spawnItem,1100);
  moveTimer=setInterval(updateItems,30);
  levelTimer=setInterval(function(){
    if(gameOver) return;
    level++; speed+=0.4;
    levelEl.textContent=level;
  },8000);
}

startBtn.addEventListener('click',startGame);

document.getElementById('btn-left').addEventListener('touchstart',function(e){e.preventDefault();moving=-1;});
document.getElementById('btn-left').addEventListener('touchend',function(e){e.preventDefault();if(moving===-1)moving=0;});
document.getElementById('btn-right').addEventListener('touchstart',function(e){e.preventDefault();moving=1;});
document.getElementById('btn-right').addEventListener('touchend',function(e){e.preventDefault();if(moving===1)moving=0;});
document.getElementById('btn-left').addEventListener('mousedown',function(){moving=-1;});
document.getElementById('btn-left').addEventListener('mouseup',function(){moving=0;});
document.getElementById('btn-right').addEventListener('mousedown',function(){moving=1;});
document.getElementById('btn-right').addEventListener('mouseup',function(){moving=0;});

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft') moving=-1;
  if(e.key==='ArrowRight') moving=1;
});
document.addEventListener('keyup',function(e){
  if(e.key==='ArrowLeft'||e.key==='ArrowRight') moving=0;
});
</script>
</body>
</html>
