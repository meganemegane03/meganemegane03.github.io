<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samon Zen Garden App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        .garden { 
            position: relative; 
            width: 320px; 
            height: 220px; 
            background: #d4c5b9; /* 乾いた砂のような色 */
            border: 8px solid #5c4033; /* 枯山水の木枠をイメージ */
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }
        .sand { 
            position: absolute; 
            width: 6px; 
            height: 6px; 
            background: #b5a495; /* 砂粒の色 */
            border-radius: 50%; 
        }
        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { padding: 12px 24px; font-size: 1rem; background: #38bdf8; border: none; border-radius: 30px; cursor: pointer; color: #0f172a; font-weight: bold; }
        .reset-btn { background: #e2e8f0; }
    </style>
</head>
<body>
    <p id="status">ボタンを押して砂庭を起動</p>
    <div class="garden" id="gardenContainer"></div>
    <div class="btn-container">
        <button class="action-btn" id="startButton">砂庭を有効化</button>
        <button class="action-btn reset-btn" id="resetButton" style="display:none;">砂をならす</button>
    </div>

    <script>
        let audio, isRunning = false;
        const container = document.getElementById('gardenContainer');
        const sands = [];
        
        const width = 320;
        const height = 220;
        const radius = 3;
        
        const minX = 15;
        const maxX = width - 15;
        const minY = 15;
        const maxY = height - 15; 

        // 砂粒の数を多め（80粒）にしてサラサラ感を演出
        const sandCount = 80;

        function resetSands() {
            sands.forEach((s, i) => {
                // 綺麗にグリッド状に初期配置、またはランダムに散らす
                s.x = minX + (i % 10) * 28 + Math.random() * 5;
                s.y = minY + Math.floor(i / 10) * 22 + Math.random() * 5;
                s.vx = 0;
                s.vy = 0;
            });
        }

        for (let i = 0; i < sandCount; i++) {
            const div = document.createElement('div');
            div.className = 'sand';
            container.appendChild(div);
            sands.push({ el: div, x: 0, y: 0, vx: 0, vy: 0 });
        }
        resetSands();

        let tiltX = 0, tiltY = 0;
        let baseGamma = null, baseBeta = null;

        function update() {
            if (isRunning) {
                let totalSpeed = 0;

                sands.forEach(s => {
                    s.vx += tiltX * 0.4; 
                    s.vy += tiltY * 0.4;
                    
                    s.vx *= 0.75; // 砂の摩擦（すぐに止まる）
                    s.vy *= 0.75;

                    if (Math.abs(s.vx) < 0.05) s.vx = 0;
                    if (Math.abs(s.vy) < 0.05) s.vy = 0;

                    s.x += s.vx; 
                    s.y += s.vy;

                    if (s.x < minX) { s.x = minX; s.vx *= -0.3; } 
                    else if (s.x > maxX) { s.x = maxX; s.vx *= -0.3; }
                    if (s.y < minY) { s.y = minY; s.vy *= -0.3; } 
                    else if (s.y > maxY) { s.y = maxY; s.vy *= -0.3; }

                    totalSpeed += Math.abs(s.vx) + Math.abs(s.vy);
                });

                // 砂粒同士の軽い押し出し合い
                for (let i = 0; i < sands.length; i++) {
                    for (let j = i + 1; j < sands.length; j++) {
                        const s1 = sands[i], s2 = sands[j];
                        const dx = s2.x - s1.x, dy = s2.y - s1.y, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < radius * 2) {
                            const angle = Math.atan2(dy, dx);
                            const overlap = (radius * 2) - dist;
                            s1.x -= Math.cos(angle) * overlap * 0.5;
                            s1.y -= Math.sin(angle) * overlap * 0.5;
                            s2.x += Math.cos(angle) * overlap * 0.5;
                            s2.y += Math.sin(angle) * overlap * 0.5;
                        }
                    }
                }

                sands.forEach(s => { 
                    s.el.style.left = (s.x - radius) + 'px'; 
                    s.el.style.top = (s.y - radius) + 'px'; 
                });

                // 音の制御（静止時は無音）
                if (audio) {
                    if (totalSpeed < 0.5) {
                        audio.muted = true;
                    } else {
                        audio.muted = false;
                        let vol = (totalSpeed - 0.5) / 15;
                        if (vol > 1.0) vol = 1.0;
                        audio.volume = vol;
                    }
                }
            }
            requestAnimationFrame(update);
        }
        update();

        document.getElementById('startButton').addEventListener('click', () => {
            audio = new Audio('wave.mp3'); // 音源は必要に応じて変更可能
            audio.loop = true;
            audio.volume = 1.0;
            audio.play();

            const handleInit = (e) => {
                if (baseGamma === null) baseGamma = e.gamma || 0;
                if (baseBeta === null) baseBeta = e.beta || 0;
                calcTilt(e);
            };

            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => {
                    if (res === 'granted') {
                        window.addEventListener('deviceorientation', handleInit);
                    }
                });
            } else {
                window.addEventListener('deviceorientation', handleInit);
            }

            isRunning = true;
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('resetButton').style.display = 'inline-block';
            document.getElementById('status').textContent = 'スマホを傾けて砂を動かそう';
        });

        // 「砂をならす」ボタンで初期位置へリセット
        document.getElementById('resetButton').addEventListener('click', () => {
            resetSands();
        });

        function calcTilt(e) {
            const gamma = e.gamma || 0;
            const beta = e.beta || 0;

            let diffGamma = gamma - baseGamma;
            let diffBeta = beta - baseBeta;

            const deadzone = 3.0;
            if (Math.abs(diffGamma) < deadzone) diffGamma = 0;
            if (Math.abs(diffBeta) < deadzone) diffBeta = 0;

            tiltX = diffGamma / 10;
            tiltY = diffBeta / 10;
        }
    </script>
</body>
</html>
